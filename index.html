          document.documentElement.classList.remove('dark');

    function getISTString() {
      try {
        return new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      } catch (e) {
        return new Date().toLocaleTimeString();
      }
    }

    function formatDuration(totalSeconds) {
      if (!totalSeconds || totalSeconds < 0) return '00:00:00';
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getTaskDuration(taskId) {
      const logs = workLogs.filter(l => String(l.task_id) === String(taskId));
      let sec = 0;
      const now = Date.now();
      logs.forEach(l => {
        const start = new Date(l.started_at).getTime();
        const end = l.ended_at ? new Date(l.ended_at).getTime() : now;
        sec += Math.max(0, Math.floor((end - start) / 1000));
      });
      return sec;
    }

    function getUserWorkTimeToday(userId) {
      try {
        const now = new Date();
        const istNowStr = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
        const istDate = new Date(istNowStr);
        istDate.setHours(0, 0, 0, 0);
        const dayStart = istDate.getTime();

        const userLogs = workLogs.filter(l => String(l.user_id) === String(userId));
        let sec = 0;
        const curTime = Date.now();
        userLogs.forEach(l => {
          const start = new Date(l.started_at).getTime();
          const end = l.ended_at ? new Date(l.ended_at).getTime() : curTime;
          if (end > dayStart) {
            const effectiveStart = Math.max(start, dayStart);
            sec += Math.max(0, Math.floor((end - effectiveStart) / 1000));
          }
        });
        return sec;
      } catch (e) {
        return 0;
      }
    }

    // 2.5-second timeout race: Never hangs the app
    async function backgroundSyncData() {
      if (!supabase) return;
      const timeoutPromise = new Promise(resolve => setTimeout(() => resolve('timeout'), 2500));

      try {
        const fetchPromise = Promise.allSettled([
          supabase.from('profiles').select('*').order('name'),
          supabase.from('tasks').select('*').order('created_at', { ascending: false }),
          supabase.from('work_log').select('*'),
          supabase.from('comments').select('*').order('created_at', { ascending: true }),
          supabase.from('payment_sheet').select('*').order('created_at', { ascending: false })
        ]);

        const result = await Promise.race([fetchPromise, timeoutPromise]);
        if (result === 'timeout') return;

        const [pRes, tRes, wRes, cRes, payRes] = result;
        if (pRes.status === 'fulfilled' && pRes.value.data && pRes.value.data.length > 0) profiles = pRes.value.data;
        if (tRes.status === 'fulfilled' && tRes.value.data && tRes.value.data.length > 0) tasks = tRes.value.data;
        if (wRes.status === 'fulfilled' && wRes.value.data) workLogs = wRes.value.data;
        if (cRes.status === 'fulfilled' && cRes.value.data) comments = cRes.value.data;
        if (payRes.status === 'fulfilled' && payRes.value.data) paymentSheet = payRes.value.data;

        const savedUserId = localStorage.getItem('taskqueue_user_id');
        if (savedUserId) currentUser = profiles.find(p => String(p.id) === String(savedUserId)) || profiles[0];
      } catch (err) {
      } finally {
        renderApp();
      }
    }

    async function loginUser(username, password) {
      authError = '';
      const email = username.includes('@') ? username : `${username.toLowerCase()}@team.app`;
      try {
        if (supabase) {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (!error && data?.user) {
            const p = profiles.find(x => String(x.id) === String(data.user.id) || (x.name && x.name.toLowerCase() === username.toLowerCase())) || {
              id: data.user.id,
              name: username,
              role: 'member'
            };
            currentUser = p;
            localStorage.setItem('taskqueue_user_id', p.id);
            renderApp();
            return;
          }
        }
        const p = profiles.find(x => (x.name && x.name.toLowerCase() === username.toLowerCase()) || String(x.id).toLowerCase() === username.toLowerCase()) || {
          id: `usr_${Date.now()}`,
          name: username,
          role: 'member',
          active: true
        };
        currentUser = p;
        localStorage.setItem('taskqueue_user_id', p.id);
        renderApp();
      } catch (err) {
        authError = err.message || 'Login notice';
        renderApp();
      }
    }

    async function signupUser(username, password, role = 'member') {
      authError = '';
      const email = username.includes('@') ? username : `${username.toLowerCase()}@team.app`;
      try {
        if (supabase) {
          const { data } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { username, role } }
          });
          const newId = data?.user?.id || `user_${Date.now()}`;
          const newProfile = { id: newId, name: username, role, active: true };
          supabase.from('profiles').upsert(newProfile);
          profiles.push(newProfile);
          currentUser = newProfile;
          localStorage.setItem('taskqueue_user_id', newId);
          renderApp();
          return;
        }
      } catch (e) {}

      const newId = `user_${Date.now()}`;
      const newProfile = { id: newId, name: username, role, active: true };
      profiles.push(newProfile);
      currentUser = newProfile;
      localStorage.setItem('taskqueue_user_id', newId);
      renderApp();
    }

    function logout() {
      if (supabase) {
        try { supabase.auth.signOut(); } catch (e) {}
      }
      currentUser = null;
      localStorage.removeItem('taskqueue_user_id');
      selectedTaskIds.clear();
      renderApp();
    }

    // STRICT SINGLE TIMER & AUTO-PAUSE
    async function startTask(taskId) {
      if (!currentUser) return;
      const nowISO = new Date().toISOString();
      const task = tasks.find(t => String(t.id) === String(taskId));
      if (!task) return;

      const targetUserId = task.assignee || currentUser.id;

      tasks.forEach(t => {
        if (String(t.assignee) === String(targetUserId) && t.status === 'running' && String(t.id) !== String(taskId)) {
          t.status = 'new';
          if (supabase) supabase.from('tasks').update({ status: 'new' }).eq('id', t.id);
        }
      });

      workLogs.forEach(log => {
        if (String(log.user_id) === String(targetUserId) && !log.ended_at) {
          log.ended_at = nowISO;
          if (supabase) supabase.from('work_log').update({ ended_at: nowISO }).eq('id', log.id);
        }
      });

      task.status = 'running';
      const newLog = {
        id: `wl_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
        task_id: String(taskId),
        user_id: String(targetUserId),
        started_at: nowISO,
        ended_at: null
      };
      workLogs.push(newLog);

      if (supabase) {
        supabase.from('tasks').update({ status: 'running' }).eq('id', taskId);
        supabase.from('work_log').insert(newLog);
      }
      renderApp();
    }

    async function pauseTask(taskId) {
      const nowISO = new Date().toISOString();
      const task = tasks.find(t => String(t.id) === String(taskId));
      if (!task) return;

      task.status = 'new';
      workLogs.forEach(l => {
        if (String(l.task_id) === String(taskId) && !l.ended_at) {
          l.ended_at = nowISO;
          if (supabase) supabase.from('work_log').update({ ended_at: nowISO }).eq('id', l.id);
        }
      });

      if (supabase) supabase.from('tasks').update({ status: 'new' }).eq('id', taskId);
      renderApp();
    }

    async function completeTask(taskId) {
      const nowISO = new Date().toISOString();
      const task = tasks.find(t => String(t.id) === String(taskId));
      if (!task) return;

      task.status = 'completed';
      task.completed_at = nowISO;
      workLogs.forEach(l => {
        if (String(l.task_id) === String(taskId) && !l.ended_at) {
          l.ended_at = nowISO;
          if (supabase) supabase.from('work_log').update({ ended_at: nowISO }).eq('id', l.id);
        }
      });

      if (supabase) supabase.from('tasks').update({ status: 'completed', completed_at: nowISO }).eq('id', taskId);
      renderApp();
    }

    async function setFollowupTask(taskId) {
      const nowISO = new Date().toISOString();
      const task = tasks.find(t => String(t.id) === String(taskId));
      if (!task) return;

      task.status = 'followup';
      task.followup_at = nowISO;
      workLogs.forEach(l => {
        if (String(l.task_id) === String(taskId) && !l.ended_at) {
          l.ended_at = nowISO;
          if (supabase) supabase.from('work_log').update({ ended_at: nowISO }).eq('id', l.id);
        }
      });

      if (supabase) supabase.from('tasks').update({ status: 'followup', followup_at: nowISO }).eq('id', taskId);
      renderApp();
    }

    async function createTask(title, assignee, priority = 'normal', work_type = 'UAN TIC', limit_min = null) {
      if (!title || !title.trim() || !currentUser) return;
      const newTask = {
        id: `t_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
        title: title.trim(),
        status: 'new',
        priority,
        work_type: work_type || 'OTHER',
        assignee: assignee || currentUser.id,
        creator: currentUser.id,
        limit_min: limit_min ? parseInt(limit_min, 10) : null,
        created_at: new Date().toISOString(),
        completed_at: null,
        acked: false
      };
      tasks.unshift(newTask);
      if (supabase) supabase.from('tasks').insert(newTask);
      renderApp();
    }

    async function bulkDeleteSelected() {
      if (selectedTaskIds.size === 0) return;
      if (!confirm(`Are you sure you want to delete ${selectedTaskIds.size} task(s)?`)) return;
      const idsToDelete = Array.from(selectedTaskIds);
      tasks = tasks.filter(t => !selectedTaskIds.has(String(t.id)));
      workLogs = workLogs.filter(w => !selectedTaskIds.has(String(w.task_id)));
      selectedTaskIds.clear();
      if (supabase) supabase.from('tasks').delete().in('id', idsToDelete);
      renderApp();
    }

    async function bulkAssignSelected(newAssigneeId) {
      if (selectedTaskIds.size === 0 || !newAssigneeId) return;
      const ids = Array.from(selectedTaskIds);
      tasks.forEach(t => {
        if (selectedTaskIds.has(String(t.id))) t.assignee = newAssigneeId;
      });
      selectedTaskIds.clear();
      if (supabase) supabase.from('tasks').update({ assignee: newAssigneeId }).in('id', ids);
      renderApp();
    }

    async function bulkSetSection(newStatus) {
      if (selectedTaskIds.size === 0) return;
      const ids = Array.from(selectedTaskIds);
      const nowISO = new Date().toISOString();
      tasks.forEach(t => {
        if (selectedTaskIds.has(String(t.id))) {
          t.status = newStatus;
          if (newStatus === 'completed') t.completed_at = nowISO;
          if (newStatus === 'followup') t.followup_at = nowISO;
          if (newStatus !== 'running') {
            workLogs.forEach(l => {
              if (String(l.task_id) === String(t.id) && !l.ended_at) l.ended_at = nowISO;
            });
          }
        }
      });
      selectedTaskIds.clear();
      if (supabase) {
        supabase.from('tasks').update({
          status: newStatus,
          completed_at: newStatus === 'completed' ? nowISO : null
        }).in('id', ids);
      }
      renderApp();
    }

    async function addPaymentEntry(taskName, amount, notes = '') {
      if (!taskName || !currentUser) return;
      const entry = {
        id: `pay_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
        user_id: String(currentUser.id),
        task_name: taskName.trim(),
        amount: parseFloat(amount) || 0,
        notes: notes.trim(),
        created_at: new Date().toISOString()
      };
      paymentSheet.unshift(entry);
      if (supabase) supabase.from('payment_sheet').insert(entry);
      renderApp();
    }

    async function deletePaymentEntry(id) {
      paymentSheet = paymentSheet.filter(p => String(p.id) !== String(id));
      if (supabase) supabase.from('payment_sheet').delete().eq('id', id);
      renderApp();
    }

    function exportPaymentCSV() {
      const rows = [
        ['Date', 'Task Name', 'Amount (INR)', 'Notes'],
        ...paymentSheet.map(p => [
          new Date(p.created_at).toLocaleDateString('en-IN'),
          `"${p.task_name.replace(/"/g, '""')}"`,
          p.amount,
          `"${(p.notes || '').replace(/"/g, '""')}"`
        ])
      ];
      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `TaskQueue_Payment_Sheet_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    setInterval(() => {
      const activeLogs = workLogs.filter(w => !w.ended_at);
      if (activeLogs.length > 0) {
        document.querySelectorAll('[data-timer-task-id]').forEach(el => {
          const tid = el.getAttribute('data-timer-task-id');
          el.textContent = formatDuration(getTaskDuration(tid));
        });
      }
      const liveClock = document.getElementById('ist-live-clock');
      if (liveClock) liveClock.textContent = getISTString();
    }, 1000);

    // ==========================================
    // RENDER ENGINE (Immediate 0ms execution)
    // ==========================================
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      try {
        if (!currentUser) {
          app.innerHTML = renderAuthScreen();
          safeRenderIcons();
          return;
        }

        const isAdmin = currentUser.role === 'admin';
        let baseTasks = tasks;
        if (!isAdmin && currentFilter !== 'all_team') {
          baseTasks = tasks.filter(t => String(t.assignee) === String(currentUser.id));
        }

        const incompleteTasks = baseTasks.filter(t => t.status !== 'completed');
        const liveTasks = baseTasks.filter(t => t.status === 'running');
        const urgentTasks = baseTasks.filter(t => t.priority === 'urgent' && t.status !== 'completed');
        const followupTasks = baseTasks.filter(t => t.status === 'followup');
        const completedTasks = baseTasks.filter(t => t.status === 'completed');

        let tabTasks = [];
        if (currentFilter === 'front') {
          const liveIds = new Set(liveTasks.map(t => String(t.id)));
          const urgentNotLive = urgentTasks.filter(t => !liveIds.has(String(t.id)));
          tabTasks = [...liveTasks, ...urgentNotLive];
        } else if (currentFilter === 'total') {
          tabTasks = incompleteTasks;
        } else if (currentFilter === 'live') {
          tabTasks = liveTasks;
        } else if (currentFilter === 'urgent') {
          tabTasks = urgentTasks;
        } else if (currentFilter === 'followup') {
          tabTasks = followupTasks;
        } else if (currentFilter === 'completed') {
          tabTasks = completedTasks;
        } else if (currentFilter === 'all_team') {
          tabTasks = tasks.filter(t => t.status !== 'completed');
        } else if (currentFilter === 'members' && selectedMemberId) {
          tabTasks = tasks.filter(t => String(t.assignee) === String(selectedMemberId) && t.status !== 'completed');
        } else {
          tabTasks = incompleteTasks;
        }

        let displayedTasks = tabTasks;
        if (currentWorkTypeFilter !== 'ALL') {
          displayedTasks = tabTasks.filter(t => (t.work_type || 'OTHER') === currentWorkTypeFilter);
        }

        const allDisplayedSelected = displayedTasks.length > 0 && displayedTasks.every(t => selectedTaskIds.has(String(t.id)));

        app.innerHTML = `
          <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                  </div>
                  <div class="leading-tight">
                    <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TaskQueue</span>
                  </div>
                </div>
                <div class="hidden md:flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-mono text-slate-600 dark:text-slate-400">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>IST:</span>
                  <span id="ist-live-clock" class="font-semibold text-slate-900 dark:text-slate-200">${getISTString()}</span>
                </div>
              </div>

              <!-- Header Actions: Payment Sheet, Theme Switcher, Name Only -->
              <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openPaymentSheet()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-800 transition">
                  <i data-lucide="receipt" class="w-4 h-4"></i>
                  <span>Payment Sheet</span>
                </button>

                <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg border border-slate-200 dark:border-slate-700">
                  <button onclick="setThemeMode('light')" title="Light Mode" class="p-1.5 rounded-md text-xs font-medium transition ${currentThemeMode === 'light' ? 'bg-white text-amber-600 shadow-xs' : 'text-slate-500 hover:text-slate-900 dark:text-slate-400'}">
                    <i data-lucide="sun" class="w-3.5 h-3.5"></i>

                    <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <div class="flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
                  <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-950 border border-indigo-200 dark:border-indigo-800 flex items-center justify-center text-indigo-700 dark:text-indigo-300 font-bold text-xs uppercase">
                    ${((currentUser && currentUser.name) || 'U').slice(0, 2)}
                  </div>
                  <div class="text-left hidden sm:block">
                    <div class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-none">${currentUser.name || 'Member'}</div>
                    <div class="text-[11px] font-mono text-slate-500 dark:text-slate-400 mt-0.5">
                      ${formatDuration(getUserWorkTimeToday(currentUser.id))} today
                    </div>
                  </div>
                  <button onclick="logout()" title="Logout" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-md transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
            <!-- 1. FAST 1-ROW DISPATCH WITH WORK TYPE -->
            <div class="mb-6 p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xs">
              <form id="fast-dispatch-form" onsubmit="handleFastDispatch(event)" class="flex flex-col sm:flex-row items-center gap-2.5">
                <div class="relative flex-1 w-full">
                  <i data-lucide="plus-circle" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input id="dispatch-title" type="text" placeholder="Type new task name & press Enter..." required
                    class="w-full pl-9 pr-3 py-2 text-sm rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-slate-100" />
                </div>

                <select id="dispatch-assignee" class="w-full sm:w-40 py-2 px-3 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200">
                  ${profiles.map(p => `
                    <option value="${p.id}" ${String(p.id) === String(currentUser.id) ? 'selected' : ''}>${p.name || 'Member'}</option>
                  `).join('')}
                </select>

                <select id="dispatch-worktype" class="w-full sm:w-36 py-2 px-3 text-xs font-bold rounded-lg bg-slate-50 dark:bg-slate-800 border border-indigo-200 dark:border-indigo-900 text-indigo-700 dark:text-indigo-400">
                  <option value="UAN TIC">UAN TIC</option>
                  <option value="RECEPTION">RECEPTION</option>
                  <option value="OTHER">OTHER</option>
                </select>

                <input id="dispatch-budget" type="number" min="1" placeholder="Mins (opt)"
                  class="w-full sm:w-24 py-2 px-3 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200" />

                <button type="button" id="dispatch-priority-btn" onclick="toggleDispatchPriority()"
                  class="w-full sm:w-auto px-3 py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100">
                  Normal
                </button>
                <input type="hidden" id="dispatch-priority" value="normal" />

                <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm flex items-center justify-center gap-1.5 transition shrink-0">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  <span>Dispatch</span>
                </button>

            </div>

            <!-- 2. KPI CARD BUTTONS -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
              <button onclick="setTab('front')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'front' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">
                  <span>Front Panel</span>
                  <i data-lucide="layout-grid" class="w-4 h-4"></i>
                </div>
                <div class="text-2xl font-black mt-2 leading-none">${liveTasks.length + urgentTasks.filter(u => u.status !== 'running').length}</div>
                <div class="text-[10px] mt-1 opacity-75">Live & Urgent only</div>
              </button>

              <button onclick="setTab('total')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'total' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">
                  <span>Total Tasks</span>
                  <i data-lucide="check-square" class="w-4 h-4"></i>

                <div class="text-2xl font-black mt-2 leading-none">${incompleteTasks.length}</div>

              <button onclick="setTab('live')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'live' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-emerald-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">

                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                </div>
                <div class="text-2xl font-black mt-2 leading-none text-emerald-500 ${currentFilter === 'live' ? '!text-white' : ''}">${liveTasks.length}</div>

              </button>

              <button onclick="setTab('urgent')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'urgent' ? 'bg-rose-600 text-white border-rose-600 shadow-md shadow-rose-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-rose-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">
                  <span>Urgent</span>
                  <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                </div>
                <div class="text-2xl font-black mt-2 leading-none text-rose-500 ${currentFilter === 'urgent' ? '!text-white' : ''}">${urgentTasks.length}</div>
                <div class="text-[10px] mt-1 opacity-75">High Priority</div>
              </button>

              <button onclick="setTab('followup')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'followup' ? 'bg-amber-600 text-white border-amber-600 shadow-md shadow-amber-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-amber-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">
                  <span>Follow-up</span>
                  <i data-lucide="clock" class="w-4 h-4"></i>
                </div>
                <div class="text-2xl font-black mt-2 leading-none text-amber-500 ${currentFilter === 'followup' ? '!text-white' : ''}">${followupTasks.length}</div>
                <div class="text-[10px] mt-1 opacity-75">Needs Follow-up</div>
              </button>

              <button onclick="setTab('completed')" class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between ${currentFilter === 'completed' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-400'}">
                <div class="flex items-center justify-between text-xs font-semibold opacity-90">
                  <span>Completed</span>
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </div>
                <div class="text-2xl font-black mt-2 leading-none">${completedTasks.length}</div>
                <div class="text-[10px] mt-1 opacity-75">Finished Archive</div>
              </button>
            </div>

            <!-- 3. SUB-CATEGORY BUTTONS: UAN TIC | RECEPTION | OTHER -->
            <div class="mb-6 p-2 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xs flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2">Category:</span>
                ${['ALL', 'UAN TIC', 'RECEPTION', 'OTHER'].map(wt => {
                  const count = tabTasks.filter(t => wt === 'ALL' ? true : (t.work_type || 'OTHER') === wt).length;
                  const isAct = currentWorkTypeFilter === wt;
                  return `
                    <button onclick="setWorkTypeFilter('${wt}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${isAct ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                      <span>${wt === 'ALL' ? 'All' : wt}</span>
                      <span class="text-[10px] px-1.5 py-0.2 rounded-full font-mono ${isAct ? 'bg-indigo-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-400'}">
                        ${count}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>

              ${currentWorkTypeFilter !== 'ALL' ? `
                <button onclick="setWorkTypeFilter('ALL')" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline px-2">
                  Reset Category
                </button>
              ` : ''}
            </div>

            <!-- 4. TASK ROWS LIST -->
            <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xs overflow-hidden">
              <div class="px-4 py-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <input type="checkbox" onchange="toggleSelectAll(this.checked)" ${allDisplayedSelected ? 'checked' : ''}
                    class="w-4 h-4 rounded-sm border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                  <span class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
                    ${currentFilter === 'front' ? 'Front Panel (Live & Urgent)' :
                      currentFilter === 'total' ? 'Total Incomplete Tasks' :
                      currentFilter === 'all_team' ? 'All Team Assigned Tasks' :
                      currentFilter.toUpperCase() + ' TASKS'} 
                    ${currentWorkTypeFilter !== 'ALL' ? `· <span class="text-indigo-600 dark:text-indigo-400">${currentWorkTypeFilter}</span>` : ''} 
                    (${displayedTasks.length})
                  </span>
                </div>
                <div class="text-xs text-slate-500 font-mono">Click task for details</div>
              </div>

              ${displayedTasks.length === 0 ? `
                <div class="py-12 text-center text-slate-400">
                  <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                  <div class="text-sm font-medium">No tasks found matching this category</div>
                </div>
              ` : `
                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${displayedTasks.map(task => {
                    const isChecked = selectedTaskIds.has(String(task.id));
                    const isRunning = task.status === 'running';
                    const assigneeName = (profiles.find(p => String(p.id) === String(task.assignee)) || {}).name || 'Unassigned';
                    const durationSec = getTaskDuration(task.id);
                    const wt = task.work_type || 'OTHER';

                    return `
                      <div class="flex items-center justify-between px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition cursor-pointer group ${isChecked ? 'bg-indigo-50/50 dark:bg-indigo-950/20' : ''}"
                           onclick="openTaskDetail('${task.id}')">
                        <div class="flex items-center gap-3 min-w-0 flex-1 pr-4" onclick="event.stopPropagation()">
                          <input type="checkbox" onchange="toggleSelectTask('${task.id}', this.checked)" ${isChecked ? 'checked' : ''}
                            class="w-4 h-4 rounded-sm border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />

                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                wt === 'UAN TIC' ? 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300' :
                                wt === 'RECEPTION' ? 'bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300' :
                                'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                              }">
                                ${wt}
                              </span>

                              ${task.priority === 'urgent' ? `
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">URGENT</span>
                              ` : ''}

                              <span class="text-sm font-medium text-slate-900 dark:text-slate-100 truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">
                                ${task.title}
                              </span>
                            </div>
                          </div>

                          ${isAdmin ? `
                            <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium">
                              <i data-lucide="user" class="w-3 h-3 text-slate-400"></i>
                              <span>${assigneeName}</span>
                            </div>
                          ` : ''}
                        </div>

                        <div class="flex items-center gap-3 shrink-0" onclick="event.stopPropagation()">
                          <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-mono font-semibold ${isRunning ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}">
                            ${isRunning ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>` : ''}
                            <span data-timer-task-id="${task.id}">${formatDuration(durationSec)}</span>
                          </div>

                          ${isRunning ? `
                            <button onclick="pauseTask('${task.id}')" title="Pause Task" class="p-1.5 rounded-md bg-amber-500 hover:bg-amber-600 text-white transition">
                              <i data-lucide="pause" class="w-4 h-4"></i>
                            </button>
                          ` : task.status !== 'completed' ? `
                            <button onclick="startTask('${task.id}')" title="Start Task" class="p-1.5 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white transition">
                              <i data-lucide="play" class="w-4 h-4"></i>
                            </button>
                          ` : `
                            <span class="text-xs text-slate-400 font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded">Done</span>
                          `}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <div class="mt-6 flex justify-center">
              <button onclick="setTab('all_team')" class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold text-xs shadow-xs transition">
                <i data-lucide="users" class="w-4 h-4 text-indigo-500"></i>
                <span>View All Assigned Team Tasks (Excluding Completed)</span>
              </button>
            </div>
          </main>

          <!-- Floating Bulk Action Bar -->
          ${selectedTaskIds.size > 0 ? `
            <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-slate-800 rounded-2xl shadow-2xl px-5 py-3.5 flex flex-wrap items-center gap-3 border border-slate-700 animate-in fade-in slide-in-from-bottom-4">
              <div class="text-xs font-bold text-indigo-300 pr-2 border-r border-slate-700">
                ${selectedTaskIds.size} Selected
              </div>

              <select onchange="bulkAssignSelected(this.value)" class="text-xs py-1.5 px-2.5 rounded-lg bg-slate-800 dark:bg-slate-700 border border-slate-600 text-white focus:outline-hidden">
                <option value="">Reassign to...</option>
                ${profiles.map(p => `<option value="${p.id}">${p.name || 'Member'}</option>`).join('')}
              </select>

              <div class="flex items-center gap-1.5">
                <button onclick="bulkSetSection('new')" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg font-medium transition">
                  Pause / Reset
                </button>
                <button onclick="bulkSetSection('followup')" class="px-2.5 py-1.5 bg-amber-600/80 hover:bg-amber-600 text-xs rounded-lg font-medium transition">
                  Follow-up
                </button>
                <button onclick="bulkSetSection('completed')" class="px-2.5 py-1.5 bg-emerald-600/80 hover:bg-emerald-600 text-xs rounded-lg font-medium transition">
                  Complete
                </button>
              </div>

              <button onclick="bulkDeleteSelected()" class="p-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg transition" title="Delete Selected">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>

              <button onclick="clearSelection()" class="text-slate-400 hover:text-white text-xs underline pl-2">
                Cancel
              </button>
            </div>
          ` : ''}

          ${showPaymentModal ? renderPaymentModal() : ''}
          ${inspectingTaskId ? renderTaskDetailModal(inspectingTaskId) : ''}
        `;
      } catch (renderError) {
        console.error("Render catch:", renderError);
      }

      safeRenderIcons();
    }

    function setTab(tab) { currentFilter = tab; selectedMemberId = null; renderApp(); }
    function setWorkTypeFilter(wt) { currentWorkTypeFilter = wt; renderApp(); }
    function filterByMember(memId) { currentFilter = 'members'; selectedMemberId = memId; renderApp(); }

    function toggleSelectTask(id, checked) {
      if (checked) selectedTaskIds.add(String(id));
      else selectedTaskIds.delete(String(id));
      renderApp();
    }

    function toggleSelectAll(checked) {
      let currentList = [];
      const isAdmin = currentUser.role === 'admin';
      let baseTasks = tasks;
      if (!isAdmin && currentFilter !== 'all_team') baseTasks = tasks.filter(t => String(t.assignee) === String(currentUser.id));

      if (currentFilter === 'front') {
        const live = baseTasks.filter(t => t.status === 'running');
        const urgent = baseTasks.filter(t => t.priority === 'urgent' && t.status !== 'completed' && t.status !== 'running');
        currentList = [...live, ...urgent];
      } else if (currentFilter === 'total') currentList = baseTasks.filter(t => t.status !== 'completed');
      else if (currentFilter === 'live') currentList = baseTasks.filter(t => t.status === 'running');
      else if (currentFilter === 'urgent') currentList = baseTasks.filter(t => t.priority === 'urgent' && t.status !== 'completed');
      else if (currentFilter === 'followup') currentList = baseTasks.filter(t => t.status === 'followup');
      else if (currentFilter === 'completed') currentList = baseTasks.filter(t => t.status === 'completed');
      else if (currentFilter === 'all_team') currentList = tasks.filter(t => t.status !== 'completed');
      else if (currentFilter === 'members' && selectedMemberId) currentList = tasks.filter(t => String(t.assignee) === String(selectedMemberId) && t.status !== 'completed');
      else currentList = baseTasks.filter(t => t.status !== 'completed');

      if (currentWorkTypeFilter !== 'ALL') {
        currentList = currentList.filter(t => (t.work_type || 'OTHER') === currentWorkTypeFilter);
      }

      if (checked) currentList.forEach(t => selectedTaskIds.add(String(t.id)));
      else selectedTaskIds.clear();
      renderApp();
    }

    function clearSelection() { selectedTaskIds.clear(); renderApp(); }

    function toggleDispatchPriority() {
      const btn = document.getElementById('dispatch-priority-btn');
      const input = document.getElementById('dispatch-priority');
      if (input.value === 'normal') {
        input.value = 'urgent';
        btn.textContent = 'Urgent';
        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-500');
      } else {
        input.value = 'normal';
        btn.textContent = 'Normal';
        btn.classList.remove('bg-rose-500', 'text-white', 'border-rose-500');
      }
    }

    function handleFastDispatch(e) {
      e.preventDefault();
      const title = document.getElementById('dispatch-title').value;
      const assignee = document.getElementById('dispatch-assignee').value;
      const worktype = document.getElementById('dispatch-worktype').value;
      const budget = document.getElementById('dispatch-budget').value;
      const priority = document.getElementById('dispatch-priority').value;
      createTask(title, assignee, priority, worktype, budget);
      document.getElementById('fast-dispatch-form').reset();
    }

    function openPaymentSheet() { showPaymentModal = true; renderApp(); }
    function closePaymentSheet() { showPaymentModal = false; renderApp(); }
    function openTaskDetail(taskId) { inspectingTaskId = taskId; renderApp(); }
    function closeTaskDetail() { inspectingTaskId = null; renderApp(); }

    function renderPaymentModal() {
      const totalAmount = paymentSheet.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
      return `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-2xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center">
                  <i data-lucide="receipt" class="w-4 h-4"></i>
                </div>
                <div>
                  <h3 class="font-bold text-slate-900 dark:text-slate-100">Payment Sheet</h3>
                  <p class="text-xs text-slate-500">Record compensation for work</p>
                </div>
              </div>
              <button onclick="closePaymentSheet()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <form onsubmit="handleNewPayment(event)" class="my-4 flex flex-col sm:flex-row gap-2">
              <input id="pay-task-name" type="text" placeholder="Task Name..." required
                class="flex-1 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100" />
              <input id="pay-amount" type="number" step="0.01" min="0" placeholder="Amount (INR)..." required
                class="w-full sm:w-36 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100" />
              <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition">
                Add Entry
              </button>
            </form>

            <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 my-2">
              ${paymentSheet.length === 0 ? `
                <div class="py-10 text-center text-slate-400 text-xs">No payment entries recorded yet.</div>
              ` : paymentSheet.map(p => `
                <div class="py-2.5 flex items-center justify-between text-xs">
                  <div class="font-medium text-slate-800 dark:text-slate-200">${p.task_name}</div>
                  <div class="flex items-center gap-3">
                    <span class="font-mono font-bold text-emerald-600 dark:text-emerald-400">₹${p.amount}</span>
                    <button onclick="deletePaymentEntry('${p.id}')" class="text-slate-400 hover:text-rose-500">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-500">Total Sum:</span>
                <span class="ml-2 font-mono font-extrabold text-lg text-emerald-600 dark:text-emerald-400">₹${totalAmount.toFixed(2)}</span>
              </div>
              <button onclick="exportPaymentCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>Export CSV</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function handleNewPayment(e) {
      e.preventDefault();
      const name = document.getElementById('pay-task-name').value;
      const amount = document.getElementById('pay-amount').value;
      addPaymentEntry(name, amount);
    }

    function renderTaskDetailModal(taskId) {
      const task = tasks.find(t => String(t.id) === String(taskId));
      if (!task) return '';
      const isRunning = task.status === 'running';
      const duration = getTaskDuration(taskId);
      const assigneeName = (profiles.find(p => String(p.id) === String(task.assignee)) || {}).name || 'Unassigned';
      const taskComments = comments.filter(c => String(c.task_id) === String(taskId));
      const wt = task.work_type || 'OTHER';

      return `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-start justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
              <div class="flex-1 pr-4">
                <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                    wt === 'UAN TIC' ? 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300' :
                    wt === 'RECEPTION' ? 'bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300' :
                    'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                  }">
                    ${wt}
                  </span>
                  ${task.priority === 'urgent' ? `
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">
                      URGENT
                    </span>
                  ` : ''}
                  <span class="text-xs text-slate-400 font-mono">Assigned to ${assigneeName}</span>
                </div>
                <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 leading-snug">${task.title}</h3>
              </div>
              <button onclick="closeTaskDetail()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="my-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
              <div>
                <div class="text-[11px] font-semibold text-slate-500 uppercase">Active Working Time</div>
                <div class="text-2xl font-black font-mono mt-0.5 ${isRunning ? 'text-emerald-500' : 'text-slate-800 dark:text-slate-200'}">
                  ${formatDuration(duration)}
                </div>
                <div class="text-[10px] text-slate-400 mt-1">
                  ${isRunning ? 'Timer counts ONLY while running. Starting another task auto-pauses this.' : 'Paused - Timer stopped'}
                </div>
              </div>
              <div>
                ${isRunning ? `
                  <button onclick="pauseTask('${task.id}'); closeTaskDetail();" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg shadow-sm">
                    Pause Task
                  </button>
                ` : task.status !== 'completed' ? `
                  <button onclick="startTask('${task.id}'); closeTaskDetail();" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow-sm">
                    Start Task
                  </button>
                ` : `
                  <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">Completed</span>
                `}
              </div>
            </div>

            <div class="flex items-center gap-2 mb-4">
              <button onclick="setFollowupTask('${task.id}'); closeTaskDetail();" class="flex-1 py-2 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300 text-xs font-bold rounded-lg hover:bg-amber-100 transition">
                Mark Follow-up
              </button>
              <button onclick="completeTask('${task.id}'); closeTaskDetail();" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow-sm transition">
                Mark Completed
              </button>
            </div>

            <div class="flex-1 overflow-y-auto mb-4 border-t border-slate-200 dark:border-slate-800 pt-3">
              <div class="text-xs font-bold text-slate-600 dark:text-slate-400 mb-2">Remarks & Discussion</div>
              <div class="space-y-2">
                ${taskComments.length === 0 ? `
                  <div class="text-xs text-slate-400 italic">No comments yet.</div>
                ` : taskComments.map(c => `
                  <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/80 text-xs">
                    <div class="flex items-center justify-between text-slate-500 text-[10px] mb-1">
                      <span class="font-bold text-slate-700 dark:text-slate-300">${c.author}</span>
                      <span>${new Date(c.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    <div class="text-slate-800 dark:text-slate-200">${c.body}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <form onsubmit="handleAddComment(event, '${task.id}')" class="flex gap-2">
              <input id="task-comment-input" type="text" placeholder="Write a remark..." required
                class="flex-1 px-3 py-1.5 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100" />
              <button type="submit" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg">
                Post
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAddComment(e, taskId) {
      e.preventDefault();
      const input = document.getElementById('task-comment-input');
      const body = input.value.trim();
      if (!body || !currentUser) return;
      const newComment = {
        id: `c_${Date.now()}`,
        task_id: String(taskId),
        author: currentUser.name || 'Member',
        body,
        created_at: new Date().toISOString()
      };
      comments.push(newComment);
      if (supabase) supabase.from('comments').insert(newComment);
      input.value = '';
      renderApp();
    }

    function renderAuthScreen() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-950">
          <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-8 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                  <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
                <div>
                  <h2 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TaskQueue</h2>
                  <p class="text-xs text-slate-500">Team Operations & Work Hours</p>
                </div>
              </div>
              <button onclick="toggleThemeQuick()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                <i data-lucide="${document.documentElement.classList.contains('dark') ? 'sun' : 'moon'}" class="w-4 h-4"></i>
              </button>
            </div>

            ${authError ? `
              <div class="p-3 mb-4 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-medium">
                ${authError}
              </div>
            ` : ''}

            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Username / Name</label>
                <input id="auth-username" type="text" placeholder="e.g. manish, priya, rahul" required
                  class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                <input id="auth-password" type="password" placeholder="••••••••" required
                  class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden" />
              </div>

              ${authMode === 'signup' ? `
                <div>
                  <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Account Role</label>
                  <select id="auth-role" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100">
                    <option value="member">Team Member</option>
                    <option value="admin">Team Lead / Admin</option>
                  </select>
                </div>
              ` : ''}

              <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition">
                ${authMode === 'login' ? 'Sign In to TaskQueue' : 'Create Account'}
              </button>
            </form>

            <div class="mt-4 text-center">
              <button onclick="toggleAuthMode()" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">
                ${authMode === 'login' ? "Don't have an account? Sign Up" : "Already have an account? Log In"}
              </button>
            </div>

            ${profiles.length > 0 ? `
              <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-800">
                <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 text-center">Instant 1-Click Access</span>
                <div class="grid grid-cols-2 gap-2">
                  ${profiles.slice(0, 4).map(p => `
                    <button onclick="quickLogin('${p.id}')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 text-xs font-bold text-slate-800 dark:text-slate-200 truncate">
                      ${p.name || 'Member'}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function toggleAuthMode() {
      authMode = authMode === 'login' ? 'signup' : 'login';
      authError = '';
      renderApp();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('auth-username').value;
      const p = document.getElementById('auth-password').value;
      if (authMode === 'login') loginUser(u, p);
      else {
        const r = document.getElementById('auth-role')?.value || 'member';
        signupUser(u, p, r);
      }
    }

    function quickLogin(userId) {
      const p = profiles.find(x => String(x.id) === String(userId));
      if (p) {
        currentUser = p;
        localStorage.setItem('taskqueue_user_id', p.id);
        renderApp();
      }
    }

    // 1. RENDER INSTANTLY AT 0ms (Never blocks, never gets stuck on loading)
    renderApp();

    // 2. BACKGROUND SYNC with Supabase
    backgroundSyncData();
  </script>
</body>
  </html>
