<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskQueue | Team Workboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light}body{background:#f4f7f6;color:#14231f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
.card{background:#fff;border:1px solid #e1e9e5;border-radius:16px;box-shadow:0 5px 18px #0b302008}
.btn{border-radius:10px;padding:.62rem .9rem;font-weight:650;font-size:.88rem;transition:.15s}.primary{background:#126b53;color:white}.primary:hover{background:#0d5743}.soft{background:#e8f3ef;color:#125c49}.danger{background:#fee9e7;color:#9d2b25}.field{width:100%;border:1px solid #d6e1dc;border-radius:10px;padding:.7rem .8rem;background:#fff;outline:none}.field:focus{border-color:#299879;box-shadow:0 0 0 3px #29987920}.navbtn{padding:.7rem .85rem;border-radius:10px;text-align:left;width:100%;font-weight:600;color:#456158}.navbtn.active,.navbtn:hover{background:#e4f2ed;color:#105f49}.pill{font-size:.72rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;background:#edf3f0;color:#35554a}.muted{color:#6b8078}.hidden{display:none!important}
</style>
</head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4">
 <div class="card w-full max-w-md p-7">
  <div class="flex items-center gap-3 mb-7"><div class="rounded-2xl bg-emerald-800 text-white p-3 font-black">TQ</div><div><h1 class="text-2xl font-extrabold">TaskQueue</h1><p class="muted text-sm">Team workboard · secure sign in</p></div></div>
  <form id="loginForm" class="space-y-4"><label class="block text-sm font-semibold">Email<input id="email" type="email" class="field mt-1" autocomplete="username" required></label><label class="block text-sm font-semibold">Password<input id="password" type="password" class="field mt-1" autocomplete="current-password" required></label><button class="btn primary w-full" type="submit">Sign in</button><p id="loginMsg" class="text-sm text-red-700"></p></form>
  <p class="text-xs muted mt-5">Accounts are managed in Supabase Auth. Do not put passwords in this HTML file.</p>
 </div>
</div>
<div id="app" class="hidden min-h-screen">
 <header class="bg-white border-b border-emerald-100 sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="bg-emerald-800 text-white rounded-xl p-2 font-black">TQ</div><div><div class="font-extrabold">TaskQueue</div><div id="who" class="text-xs muted"></div></div></div><div class="flex gap-2 items-center"><span id="rolePill" class="pill"></span><button id="logout" class="btn soft">Sign out</button></div></div></header>
 <div class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-[210px_1fr] gap-4">
  <aside class="card p-3 h-fit"><div class="text-xs uppercase tracking-widest muted px-3 py-2">Workspace</div><nav id="nav" class="space-y-1"></nav><div class="border-t mt-4 pt-4 px-3 text-xs muted">Signed-in account permissions are enforced by Supabase.</div></aside>
  <main class="min-w-0"><div id="pageTitle" class="text-2xl font-extrabold mb-1">Live Tasks</div><p id="pageSub" class="muted mb-5 text-sm">Track work, follow-ups and completion.</p><div id="content"></div></main>
 </div>
</div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white rounded-xl px-4 py-3 text-sm shadow-lg hidden z-50"></div>
<script>
/* Set these to your own Supabase project values. The anon/publishable key is intended for browser use,
   but database RLS must be configured correctly. Never use a service_role key here. */
const SUPABASE_URL = "https://kgswcptimmeslnosbhnb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnc3djcHRpbW1lc2xub3NiaG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MDI4ODMsImV4cCI6MjEwODQ3ODg4M30.wXO8revHdkBfnCJzwt_dNymaeMaG0-3I5vH4W6qNGe0";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state={user:null,profile:null,profiles:[],tasks:[],logs:[],comments:[],page:"live",selectedMember:null,selectedTask:null,reportDate:new Date().toLocaleDateString('en-CA'),month:new Date().toISOString().slice(0,7)};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStaff=()=>['admin','super_admin'].includes(state.profile?.role);
const isSuper=()=>state.profile?.role==='super_admin';
const notify=m=>{ $('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000); };
const fmt=d=>d?new Date(d).toLocaleString(): '—';
const mins=n=>{n=Math.max(0,Math.round(n||0));return `${Math.floor(n/60)}h ${n%60}m`;};
const dayStart=d=>new Date(d+'T00:00:00').toISOString();
const dayEnd=d=>new Date(new Date(d+'T00:00:00').getTime()+86400000).toISOString();
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(session) await enter(session.user); else showLogin();
 sb.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin();});
}
function showLogin(){ $('app').classList.add('hidden');$('login').classList.remove('hidden');state.user=null;state.profile=null; }
async function enter(user){
 state.user=user;
 const {data:profile,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(error||!profile||!profile.active){await sb.auth.signOut();$('loginMsg').textContent='Your profile is missing or inactive. Ask an administrator to provision your account.';return;}
 state.profile=profile;
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('who').textContent=profile.full_name;$('rolePill').textContent='TASKQUEUE ACCESS';
 await loadAll();renderNav();render();
}
async function loadAll(){
 const [p,t,l,c]=await Promise.all([
  sb.from('profiles').select('*').eq('active',true).order('full_name'),
  sb.from('tasks').select('*').is('deleted_at',null).order('created_at',{ascending:false}),
  sb.from('work_log').select('*').order('event_at'),
  sb.from('task_comments').select('*').order('created_at')
 ]);
 const err=[p,t,l,c].find(x=>x.error);
 if(err){notify('Load error: '+err.error.message);return;}
 state.profiles=p.data||[];state.tasks=t.data||[];state.logs=l.data||[];state.comments=c.data||[];
}
function navItems(){
 let items=[['live','Live Tasks'],['followup','Follow-up'],['mine','My Tasks'],['completed','Completed']];
 if(isStaff())items.push(['members','Members'],['reports','Reports'],['uan','UAN TIC'],['reception','Reception'],['other','Other']);
 if(isSuper())items.push(['super','Super Admin Overview']);
 return items;
}
function renderNav(){ $('nav').innerHTML=navItems().map(([id,label])=>`<button class="navbtn ${state.page===id?'active':''}" data-page="${id}">${label}</button>`).join('');$('nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.selectedMember=null;state.selectedTask=null;renderNav();render();}); }
function profileName(id){return state.profiles.find(p=>p.id===id)?.full_name||'Unassigned';}
function taskRow(t,actions=true){return `<div class="border rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><button class="text-left min-w-0 flex-1" data-task="${t.id}"><div class="font-bold">${esc(t.title)}</div><div class="text-sm muted mt-1">${esc(t.category)} · ${esc(profileName(t.assigned_to))} · ${esc(t.priority)} · ${esc(t.status)}</div><div class="text-xs muted mt-1">${esc(t.description||'No description')} · Created ${esc(fmt(t.created_at))}</div>${t.status==='followup'?`<div class="text-xs text-amber-700 mt-1">Follow-up: ${esc(fmt(t.followup_at))}</div>`:''}</button>${actions?`<div class="flex flex-wrap gap-2">${t.status==='new'?`<button class="btn primary" data-action="start" data-id="${t.id}">Start</button>`:''}${t.status==='running'?`<button class="btn soft" data-action="pause" data-id="${t.id}">Pause</button><button class="btn primary" data-action="complete" data-id="${t.id}">Complete</button>`:''}${['paused','followup'].includes(t.status)?`<button class="btn primary" data-action="resume" data-id="${t.id}">Resume</button>`:''}</div>`:''}</div>`}
function visibleTasks(){return state.tasks.filter(t=>isStaff()||t.assigned_to===state.user.id||t.created_by===state.user.id);}
function card(title,value,sub,click){return `<button ${click?`data-card="${click}"`:''} class="card p-4 text-left ${click?'hover:border-emerald-400':''}"><div class="muted text-sm">${title}</div><div class="text-3xl font-extrabold mt-1">${value}</div><div class="text-xs muted mt-1">${sub||''}</div></button>`}
function render(){
 const title=({live:'Live Tasks',followup:'Follow-up Queue',mine:'My Tasks',completed:'Completed Tasks',members:'Members & Workload',reports:'Reports',uan:'UAN TIC Tasks',reception:'Reception Tasks',other:'Other Tasks',super:'Super Admin Overview'})[state.page]||'TaskQueue';
 $('pageTitle').textContent=title;$('pageSub').textContent=`${state.profile.full_name} · ${new Date().toLocaleDateString()}`;
 const all=visibleTasks(),live=all.filter(t=>t.status==='running'),follow=all.filter(t=>t.status==='followup'||t.status==='paused'),done=all.filter(t=>t.status==='completed');
 let html='';
 if(['live','mine','followup','completed','uan','reception','other'].includes(state.page)){
  let arr=state.page==='live'?all.filter(t=>t.status==='running'||t.status==='new'):state.page==='mine'?all.filter(t=>t.assigned_to===state.user.id||t.created_by===state.user.id):state.page==='followup'?follow:state.page==='completed'?done:all.filter(t=>t.category==={'uan':'UAN TIC','reception':'Reception','other':'Other'}[state.page]);
  if(isStaff()&&['uan','reception','other'].includes(state.page))arr=state.tasks.filter(t=>t.category==={'uan':'UAN TIC','reception':'Reception','other':'Other'}[state.page]&&t.status!=='completed');
  html=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${card('Live',live.length,'Currently running')}${card('Follow-ups',follow.length,'Paused or scheduled')}${card('Completed',done.length,'Visible to you')}${card('All tasks',all.length,'Visible tasks')}</div>`;
  if(isStaff()&&state.page!=='completed')html+=`<div class="card p-4 mb-4"><h3 class="font-bold mb-3">Create task</h3><form id="newTask" class="grid sm:grid-cols-2 gap-3"><input class="field" name="title" placeholder="Task title" required><select class="field" name="category"><option>UAN TIC</option><option>Reception</option><option selected>Other</option></select><select class="field" name="assigned_to"><option value="">Unassigned</option>${state.profiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select><select class="field" name="priority"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="urgent">Urgent</option></select><textarea class="field sm:col-span-2" name="description" placeholder="Task details"></textarea><button class="btn primary sm:col-span-2">Create task</button></form></div>`;
  html+=arr.length?`<div class="space-y-3">${arr.map(t=>taskRow(t)).join('')}</div>`:`<div class="card p-8 text-center muted">No tasks in this view.</div>`;
 }
 if(state.page==='members'){
  if(state.selectedMember){const m=state.profiles.find(p=>p.id===state.selectedMember);const ts=state.tasks.filter(t=>t.assigned_to===m?.id||t.created_by===m?.id);html+=`<button class="btn soft mb-4" id="backMembers">← All members</button><div class="card p-5 mb-4"><h2 class="text-xl font-bold">${esc(m?.full_name)}</h2></div><div class="space-y-3">${ts.map(t=>taskRow(t,false)).join('')||'<div class="card p-6 muted">No tasks.</div>'}</div>`}
  else html=`<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">${state.profiles.map(p=>{let ts=state.tasks.filter(t=>t.assigned_to===p.id),r=ts.filter(t=>t.status==='running').length,d=ts.filter(t=>t.status==='completed').length;return `<button class="card p-5 text-left hover:border-emerald-400" data-member="${p.id}"><div class="font-bold text-lg">${esc(p.full_name)}</div><div class="grid grid-cols-3 gap-2 mt-4 text-sm"><div><b>${ts.length}</b><div class="muted text-xs">Assigned</div></div><div><b>${r}</b><div class="muted text-xs">Live</div></div><div><b>${d}</b><div class="muted text-xs">Done</div></div></div></button>`}).join('')}</div>`;
 }
 if(state.page==='reports'||state.page==='super'){
  html=`<div class="card p-4 mb-4"><div class="grid sm:grid-cols-3 gap-3 items-end"><label class="text-sm font-semibold">Report day<input id="reportDate" type="date" class="field mt-1" value="${esc(state.reportDate)}"></label><label class="text-sm font-semibold">Month<input id="month" type="month" class="field mt-1" value="${esc(state.month)}"></label><button class="btn primary" id="refreshReport">Refresh report</button></div></div>`;
  const d0=dayStart(state.reportDate),d1=dayEnd(state.reportDate),dayTasks=state.tasks.filter(t=>t.created_at>=d0&&t.created_at<d1),completed=state.tasks.filter(t=>t.status==='completed'&&t.completed_at>=d0&&t.completed_at<d1);
  const monthTasks=state.tasks.filter(t=>t.created_at?.slice(0,7)===state.month),monthDone=state.tasks.filter(t=>t.status==='completed'&&t.completed_at?.slice(0,7)===state.month);
  const logs=state.logs.filter(l=>l.event_at>=d0&&l.event_at<d1);
  const rows=state.profiles.map(p=>{let own=state.tasks.filter(t=>t.assigned_to===p.id&&t.created_at>=d0&&t.created_at<d1),done=completed.filter(t=>t.assigned_to===p.id),starts=logs.filter(l=>l.user_id===p.id&&l.event_type==='start').length,pauses=logs.filter(l=>l.user_id===p.id&&l.event_type==='pause').length;return `<tr class="border-t"><td class="p-3 font-semibold">${esc(p.full_name)}</td><td class="p-3">${own.length}</td><td class="p-3">${done.length}</td><td class="p-3">${starts}</td><td class="p-3">${pauses}</td></tr>`}).join('');
  html+=`<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-4">${card('Tasks created today',dayTasks.length,'Selected day')}${card('Completed today',completed.length,'Selected day')}${card('Monthly tasks',monthTasks.length,state.month)}${card('Monthly completed',monthDone.length,state.month)}</div><div class="card p-4 mb-4"><h3 class="font-bold mb-3">Daily member report · ${esc(state.reportDate)}</h3><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead><tr class="muted"><th class="p-3">Member</th><th class="p-3">Assigned today</th><th class="p-3">Completed today</th><th class="p-3">Starts logged</th><th class="p-3">Pauses logged</th></tr></thead><tbody>${rows}</tbody></table></div><p class="text-xs muted mt-3">Start/pause counts come from work-log events. Idle/empty time is not reliably inferable unless all work activity is tracked; this version does not invent it.</p></div><div class="card p-4"><h3 class="font-bold mb-3">Completed tasks for selected day</h3><div class="space-y-3">${completed.map(t=>taskRow(t,false)).join('')||'<p class="muted">No completed tasks for this day.</p>'}</div></div>`;
 }
 if(state.page==='super')html=`<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-4">${card('All live',state.tasks.filter(t=>t.status==='running').length,'Every member')}${card('Follow-up',state.tasks.filter(t=>['paused','followup'].includes(t.status)).length,'Paused/scheduled')}${card('Members',state.profiles.length,'Active profiles')}${card('Completed',state.tasks.filter(t=>t.status==='completed').length,'All time')}</div>`+html;
 $('content').innerHTML=html;
 bindContent();
}
function bindContent(){
 $('content').querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>showTask(b.dataset.task));
 $('content').querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{state.selectedMember=b.dataset.member;render();});
 $('content').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>taskAction(b.dataset.action,b.dataset.id));
 if($('backMembers'))$('backMembers').onclick=()=>{state.selectedMember=null;render();};
 if($('newTask'))$('newTask').onsubmit=createTask;
 if($('reportDate'))$('reportDate').onchange=e=>{state.reportDate=e.target.value;};
 if($('month'))$('month').onchange=e=>{state.month=e.target.value;};
 if($('refreshReport'))$('refreshReport').onclick=async()=>{await loadAll();render();};
}
async function createTask(e){
 e.preventDefault();const f=new FormData(e.target);
 const row={title:String(f.get('title')).trim(),category:f.get('category'),assigned_to:f.get('assigned_to')||null,priority:f.get('priority'),description:String(f.get('description')||''),created_by:state.user.id};
 const {error}=await sb.from('tasks').insert(row);if(error){notify(error.message);return;}
 await loadAll();render();notify('Task created.');
}
async function taskAction(action,id){
 const t=state.tasks.find(x=>x.id===id);if(!t)return;
 let patch={},event=action,note='';
 if(action==='start'||action==='resume'){patch={status:'running',started_at:new Date().toISOString(),paused_at:null,followup_at:null};event=action==='start'?'start':'resume';}
 if(action==='pause'){
  const when=prompt('Schedule follow-up date/time (optional), e.g. 2026-10-29 14:30. Leave blank to add to follow-up queue now:','');
  patch={status:when?'followup':'paused',paused_at:new Date().toISOString(),followup_at:when?new Date(when.replace(' ','T')).toISOString():null};event='pause';note=when?`Follow-up scheduled: ${when}`:'Paused; follow-up unscheduled';
 }
 if(action==='complete'){if(!confirm('Mark this task completed?'))return;patch={status:'completed',completed_at:new Date().toISOString()};event='complete';}
 const {error}=await sb.from('tasks').update(patch).eq('id',id);if(error){notify(error.message);return;}
 const {error:le}=await sb.from('work_log').insert({task_id:id,user_id:state.user.id,event_type:event,note});
 if(le)notify('Task updated; work log warning: '+le.message);
 await loadAll();render();notify('Task updated.');
}
async function showTask(id){
 const t=state.tasks.find(x=>x.id===id);if(!t)return;
 const comments=state.comments.filter(c=>c.task_id===id);
 const body=prompt(`${t.title}\nCategory: ${t.category}\nStatus: ${t.status}\nAssigned: ${profileName(t.assigned_to)}\nDescription: ${t.description||'—'}\nFollow-up: ${fmt(t.followup_at)}\n\nEnter a comment to add, or leave blank to close:`);
 if(body?.trim()){const {error}=await sb.from('task_comments').insert({task_id:id,user_id:state.user.id,body:body.trim()});if(error)notify(error.message);else{await sb.from('work_log').insert({task_id:id,user_id:state.user.id,event_type:'comment',note:body.trim()});await loadAll();notify('Comment added.');}}
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return;}const {data:{user}}=await sb.auth.getUser();await enter(user);});
$('logout').onclick=async()=>{await sb.auth.signOut();showLogin();};
boot();
</script>
</body></html>
