<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>TaskQueue - Team Operations & Dispatch</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .btn-action { transition: all 0.15s ease-in-out; }
    .btn-action:active { transform: scale(0.97); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-150">

  <!-- ROOT CONTAINER (Pre-populated markup ensures page is NEVER a blank white screen) -->
  <div id="app" class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </div>
          <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TaskQueue</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500">Connecting to TaskQueue workspace...</span>
        </div>
      </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
      <div class="p-8 text-center text-slate-500">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
        <p class="font-semibold text-sm">Synchronizing tasks and team live board...</p>
      </div>
    </main>
  </div>

  <script>
    (function() {
      'use strict';

      // Native Inline SVGs (No CDN dependencies)
      const ICONS = {
        layers: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>',
        play: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon></svg>',
        pause: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect></svg>',
        check: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>',
        trash: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>',
        clock: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"></path></svg>',
        receipt: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>',
        sun: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>',
        moon: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>',
        monitor: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"></rect><line x1="8" y1="21" x2="16" y2="21" stroke-width="2"></line><line x1="12" y1="17" x2="12" y2="21" stroke-width="2"></line></svg>',
        plus: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>',
        close: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
        download: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>',
        alert: '<svg class="w-3.5 h-3.5 text-rose-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>'
      };

      // Supabase Client: Named `sb` to avoid collision with window.supabase
      const SUPABASE_URL = "https://kgswcptimmeslnosbhnb.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnc3djcHRpbW1lc2xub3NiaG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MDI4ODMsImV4cCI6MjEwODQ3ODg4M30.wXO8revHdkBfnCJzwt_dNymaeMaG0-3I5vH4W6qNGe0";
      let sb = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) {
        console.warn("Supabase init notice:", e);
      }

      // Theme Management
      let currentThemeMode = localStorage.getItem('taskqueue_theme') || 'system';

      function applyTheme() {
        try {
          if (currentThemeMode === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (currentThemeMode === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      }

      function setThemeMode(mode) {
        currentThemeMode = mode;
        localStorage.setItem('taskqueue_theme', mode);
        applyTheme();
        renderApp();
      }
      applyTheme();

      // Seed Profiles & Tasks
      const DEFAULT_PROFILES = [
        { id: 'usr_manish', name: 'Manish Joshi', role: 'admin', active: true },
        { id: 'usr_priya', name: 'Priya Sharma', role: 'member', active: true },
        { id: 'usr_rahul', name: 'Rahul Verma', role: 'member', active: true },
        { id: 'usr_reception', name: 'Reception Desk', role: 'member', active: true }
      ];

      const DEFAULT_TASKS = [
        {
          id: 'tsk_seed_1',
          title: 'Process incoming UAN registration claims',
          descr: 'Verify member portal documents and approve pending requests.',
          status: 'running',
          priority: 'urgent',
          work_type: 'UAN TIC',
          assignee: 'usr_manish',
          creator: 'usr_manish',
          acked: true,
          limit_min: 45,
          created_at: new Date(Date.now() - 3600000).toISOString()
        },
        {
          id: 'tsk_seed_2',
          title: 'Front desk visitor logs & morning call dispatch',
          descr: 'Review daily scheduled interviews and visitor passes.',
          status: 'new',
          priority: 'normal',
          work_type: 'RECEPTION',
          assignee: 'usr_reception',
          creator: 'usr_manish',
          acked: true,
          limit_min: 30,
          created_at: new Date(Date.now() - 7200000).toISOString()
        },
        {
          id: 'tsk_seed_3',
          title: 'Monthly billing reconciliation & server maintenance',
          descr: 'Review uptime logs and export invoice sheets.',
          status: 'new',
          priority: 'normal',
          work_type: 'OTHER',
          assignee: 'usr_priya',
          creator: 'usr_manish',
          acked: true,
          limit_min: 60,
          created_at: new Date(Date.now() - 10800000).toISOString()
        }
      ];

      const DEFAULT_WORKLOGS = [
        {
          id: 'wl_seed_1',
          task_id: 'tsk_seed_1',
          user_id: 'usr_manish',
          started_at: new Date(Date.now() - 1200000).toISOString(),
          ended_at: null
        }
      ];

      let profiles = [...DEFAULT_PROFILES];
      let tasks = [...DEFAULT_TASKS];
      let workLogs = [...DEFAULT_WORKLOGS];
      let comments = [];
      let paymentSheet = [
        { id: 'pay_seed_1', user_id: 'usr_manish', task_name: 'UAN Bulk Processing Batch #104', amount: 1500, created_at: new Date().toISOString() }
      ];
      let selectedTaskIds = new Set();

      let currentUser = DEFAULT_PROFILES[0];
      try {
        const savedUserId = localStorage.getItem('taskqueue_user_id');
        if (savedUserId) {
          const found = profiles.find(p => String(p.id) === String(savedUserId));
          if (found) {
            currentUser = found;
            if (currentUser.name && currentUser.name.toLowerCase().includes('manish')) {
              currentUser.role = 'admin';
            }
          }
        }
      } catch (e) {}

      let currentFilter = 'front';
      let currentWorkTypeFilter = 'ALL';
      let selectedMemberId = null;
      let inspectingTaskId = null;
      let showPaymentModal = false;

      function getISTString() {
        try {
          return new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        } catch (e) {
          return new Date().toLocaleTimeString();
        }
      }

      function formatDuration(totalSeconds) {
        if (!totalSeconds || totalSeconds < 0) return '00:00:00';
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = Math.floor(totalSeconds % 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function getTaskDuration(taskId) {
        const logs = workLogs.filter(l => String(l.task_id) === String(taskId));
        let sec = 0;
        const now = Date.now();
        logs.forEach(l => {
          const start = new Date(l.started_at).getTime();
          const end = l.ended_at ? new Date(l.ended_at).getTime() : now;
          sec += Math.max(0, Math.floor((end - start) / 1000));
        });
        return sec;
      }

      function getUserWorkTimeToday(userId) {
        try {
          const now = new Date();
          const istNowStr = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
          const istDate = new Date(istNowStr);
          istDate.setHours(0, 0, 0, 0);
          const dayStart = istDate.getTime();

          const userLogs = workLogs.filter(l => String(l.user_id) === String(userId));
          let sec = 0;
          const curTime = Date.now();
          userLogs.forEach(l => {
            const start = new Date(l.started_at).getTime();
            const end = l.ended_at ? new Date(l.ended_at).getTime() : curTime;
            if (end > dayStart) {
              const effectiveStart = Math.max(start, dayStart);
              sec += Math.max(0, Math.floor((end - effectiveStart) / 1000));
            }
          });
          return sec;
        } catch (e) {
          return 0;
        }
      }

      async function backgroundSyncData() {
        if (!sb) return;
        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve('timeout'), 3000));
        try {
          const fetchPromise = Promise.allSettled([
            sb.from('profiles').select('*').order('name'),
            sb.from('tasks').select('*').order('created_at', { ascending: false }),
            sb.from('work_log').select('*'),
            sb.from('comments').select('*').order('created_at', { ascending: true }),
            sb.from('payment_sheet').select('*').order('created_at', { ascending: false })
          ]);
          const result = await Promise.race([fetchPromise, timeoutPromise]);
          if (result === 'timeout') return;

          const [pRes, tRes, wRes, cRes, payRes] = result;
          if (pRes.status === 'fulfilled' && pRes.value.data && pRes.value.data.length > 0) {
            profiles = pRes.value.data.map(p => {
              if (p.name && p.name.toLowerCase().includes('manish')) {
                return { ...p, role: 'admin' };
              }
              return p;
            });
          }
          if (tRes.status === 'fulfilled' && tRes.value.data && tRes.value.data.length > 0) tasks = tRes.value.data;
          if (wRes.status === 'fulfilled' && wRes.value.data) workLogs = wRes.value.data;
          if (cRes.status === 'fulfilled' && cRes.value.data) comments = cRes.value.data;
          if (payRes.status === 'fulfilled' && payRes.value.data) paymentSheet = payRes.value.data;

          const savedUserId = localStorage.getItem('taskqueue_user_id');
          if (savedUserId) {
            const match = profiles.find(p => String(p.id) === String(savedUserId));
            if (match) currentUser = match;
          }
        } catch (err) {
        } finally {
          renderApp();
        }
      }

      setInterval(() => {
        const clockElem = document.getElementById('ist-live-clock');
        if (clockElem) clockElem.innerText = getISTString();

        const activeRunningTasks = tasks.filter(t => t.status === 'running');
        if (activeRunningTasks.length > 0) {
          activeRunningTasks.forEach(t => {
            const timerEl = document.getElementById(`task-timer-${t.id}`);
            if (timerEl) timerEl.innerText = formatDuration(getTaskDuration(t.id));
          });
          const userTimeEl = document.getElementById('user-worktime-display');
          if (userTimeEl && currentUser) {
            userTimeEl.innerText = `${formatDuration(getUserWorkTimeToday(currentUser.id))} today`;
          }
        }
      }, 1000);

      async function startTask(taskId) {
        if (!currentUser) return;
        const task = tasks.find(t => String(t.id) === String(taskId));
        if (!task) return;

        const now = new Date().toISOString();
        const targetUserId = task.assignee || currentUser.id;

        const otherRunning = tasks.filter(t => String(t.assignee) === String(targetUserId) && t.status === 'running' && String(t.id) !== String(taskId));
        otherRunning.forEach(t => {
          t.status = 'paused';
          const openLog = workLogs.find(l => String(l.task_id) === String(t.id) && !l.ended_at);
          if (openLog) openLog.ended_at = now;
        });

        task.status = 'running';
        task.acked = true;

        const newLog = {
          id: `wl_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          task_id: String(taskId),
          user_id: String(targetUserId),
          started_at: now,
          ended_at: null
        };
        workLogs.push(newLog);

        renderApp();

        if (sb) {
          try {
            await sb.from('work_log').update({ ended_at: now }).eq('user_id', targetUserId).is('ended_at', null);
            await sb.from('tasks').update({ status: 'paused' }).eq('assignee', targetUserId).eq('status', 'running').neq('id', taskId);
            await sb.from('tasks').update({ status: 'running', acked: true }).eq('id', taskId);
            await sb.from('work_log').insert(newLog);
          } catch (e) {}
        }
      }

      async function pauseTask(taskId) {
        const task = tasks.find(t => String(t.id) === String(taskId));
        if (!task) return;
        const now = new Date().toISOString();
        task.status = 'paused';

        const openLog = workLogs.find(l => String(l.task_id) === String(taskId) && !l.ended_at);
        if (openLog) openLog.ended_at = now;

        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').update({ status: 'paused' }).eq('id', taskId);
            await sb.from('work_log').update({ ended_at: now }).eq('task_id', taskId).is('ended_at', null);
          } catch (e) {}
        }
      }

      async function completeTask(taskId) {
        const task = tasks.find(t => String(t.id) === String(taskId));
        if (!task) return;
        const now = new Date().toISOString();
        task.status = 'completed';
        task.completed_at = now;

        const openLog = workLogs.find(l => String(l.task_id) === String(taskId) && !l.ended_at);
        if (openLog) openLog.ended_at = now;

        selectedTaskIds.delete(String(taskId));
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').update({ status: 'completed', completed_at: now }).eq('id', taskId);
            await sb.from('work_log').update({ ended_at: now }).eq('task_id', taskId).is('ended_at', null);
          } catch (e) {}
        }
      }

      async function deleteTask(taskId) {
        tasks = tasks.filter(t => String(t.id) !== String(taskId));
        selectedTaskIds.delete(String(taskId));
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').delete().eq('id', taskId);
          } catch (e) {}
        }
      }

      async function createTask(title, assignee, priority = 'normal', work_type = 'UAN TIC', limit_min = 45) {
        if (!title || !title.trim() || !currentUser) return;
        const newTask = {
          id: `tsk_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
          title: title.trim(),
          descr: '',
          status: 'new',
          priority: priority || 'normal',
          work_type: work_type || 'UAN TIC',
          assignee: assignee || currentUser.id,
          creator: currentUser.id,
          acked: false,
          limit_min: parseInt(limit_min, 10) || 45,
          created_at: new Date().toISOString()
        };
        tasks.unshift(newTask);
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').insert(newTask);
          } catch (e) {}
        }
      }

      async function bulkAssign(targetUserId) {
        if (selectedTaskIds.size === 0 || !targetUserId) return;
        const ids = Array.from(selectedTaskIds);
        tasks.forEach(t => {
          if (selectedTaskIds.has(String(t.id))) t.assignee = targetUserId;
        });
        selectedTaskIds.clear();
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').update({ assignee: targetUserId }).in('id', ids);
          } catch (e) {}
        }
      }

      async function bulkChangeStatus(newStatus) {
        if (selectedTaskIds.size === 0) return;
        const ids = Array.from(selectedTaskIds);
        const now = new Date().toISOString();

        tasks.forEach(t => {
          if (selectedTaskIds.has(String(t.id))) {
            t.status = newStatus;
            if (newStatus === 'completed') {
              t.completed_at = now;
              const openLog = workLogs.find(l => String(l.task_id) === String(t.id) && !l.ended_at);
              if (openLog) openLog.ended_at = now;
            }
          }
        });
        selectedTaskIds.clear();
        renderApp();

        if (sb) {
          try {
            const payload = { status: newStatus };
            if (newStatus === 'completed') payload.completed_at = now;
            await sb.from('tasks').update(payload).in('id', ids);
          } catch (e) {}
        }
      }

      async function bulkDelete() {
        if (selectedTaskIds.size === 0) return;
        const ids = Array.from(selectedTaskIds);
        tasks = tasks.filter(t => !selectedTaskIds.has(String(t.id)));
        selectedTaskIds.clear();
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').delete().in('id', ids);
          } catch (e) {}
        }
      }

      async function recordPayment(taskName, amount, notes = '') {
        if (!taskName || !currentUser) return;
        const newPay = {
          id: `pay_${Date.now()}`,
          user_id: String(currentUser.id),
          task_name: taskName,
          amount: parseFloat(amount) || 0,
          notes: notes || '',
          created_at: new Date().toISOString()
        };
        paymentSheet.unshift(newPay);
        renderApp();

        if (sb) {
          try {
            await sb.from('payment_sheet').insert(newPay);
          } catch (e) {}
        }
      }

      function exportPaymentSheetCSV() {
        if (paymentSheet.length === 0) return;
        let csv = "ID,User ID,Task Name,Amount (INR),Notes,Date\n";
        paymentSheet.forEach(p => {
          csv += `"${p.id}","${p.user_id}","${(p.task_name || '').replace(/"/g, '""')}","${p.amount}","${(p.notes || '').replace(/"/g, '""')}","${p.created_at}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `payment_sheet_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function renderTaskRow(task, isAdmin) {
        const isSelected = selectedTaskIds.has(String(task.id));
        const isRunning = task.status === 'running';
        const isCompleted = task.status === 'completed';
        const isUrgent = task.priority === 'urgent';
        const durationSec = getTaskDuration(task.id);
        const assigneeObj = profiles.find(p => String(p.id) === String(task.assignee));
        const assigneeName = assigneeObj ? assigneeObj.name : 'Unassigned';

        const wt = task.work_type || 'OTHER';

              ${isUrgent ? `<span class="shrink-0">${ICONS.alert}</span>` : ''}

                <button onclick="window.openTaskDetail('${task.id}')" class="text-left font-semibold text-xs sm:text-sm text-slate-900 dark:text-slate-100 hover:text-indigo-600 dark:hover:text-indigo-400 truncate block w-full ${isCompleted ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                  ${task.title}
                </button>

            </div>

            <div class="flex items-center gap-4 sm:gap-8 shrink-0">
              ${isAdmin ? `
                <div class="hidden sm:block text-right w-28 truncate">
                  <span class="text-xs text-slate-600 dark:text-slate-400 font-medium">${assigneeName}</span>

                  <span class="text-[11px] font-bold text-violet-600 dark:text-violet-400 px-2 py-0.5 rounded-md bg-violet-50 dark:bg-violet-950/60">Done</span>
                ` : `
                  ${isRunning ? `
                    <button onclick="window.pauseTask('${task.id}')" title="Pause Task" class="btn-action p-1.5 rounded-lg bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 hover:bg-amber-200">
                      ${ICONS.pause}
                    </button>
                  ` : `
                    <button onclick="window.startTask('${task.id}')" title="Start Task" class="btn-action p-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-200">
                      ${ICONS.play}
                    </button>
                  `}
                  <button onclick="window.completeTask('${task.id}')" title="Mark Complete" class="btn-action p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-violet-100 hover:text-violet-700">
                    ${ICONS.check}
                  </button>
                `}
                <button onclick="window.deleteTask('${task.id}')" title="Delete Task" class="btn-action p-1.5 rounded-lg text-slate-400 hover:bg-rose-100 hover:text-rose-600">
                  ${ICONS.trash}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderPaymentModal() {
        const totalAmount = paymentSheet.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-2xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
              <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center">
                    ${ICONS.receipt}
                  </div>
                  <div>
                    <h3 class="font-bold text-slate-900 dark:text-slate-100">Payment Sheet</h3>
                    <p class="text-xs text-slate-500">Record compensation for work</p>
                  </div>
                </div>
                <button onclick="window.closePaymentSheet()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                  ${ICONS.close}
                </button>
              </div>

              <form onsubmit="window.handleNewPayment(event)" class="my-4 flex flex-col sm:flex-row gap-2">
                <input id="pay-task-name" type="text" placeholder="Task Name..." required
                  class="flex-1 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none" />
                <input id="pay-amount" type="number" step="0.01" min="0" placeholder="Amount (INR)..." required
                  class="w-full sm:w-36 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none" />
                <button type="submit" class="btn-action px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg">
                  Add Entry
                </button>
              </form>

              <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 my-2">
                ${paymentSheet.length === 0 ? `
                  <div class="py-10 text-center text-slate-400 text-xs">No payment entries recorded yet.</div>
                ` : paymentSheet.map(p => `
                  <div class="py-2.5 flex items-center justify-between text-xs">
                    <span class="font-medium text-slate-800 dark:text-slate-200 truncate pr-4">${p.task_name}</span>
                    <span class="font-mono font-bold text-emerald-600 dark:text-emerald-400 shrink-0">₹${Number(p.amount).toLocaleString('en-IN')}</span>
                  </div>
                `).join('')}
              </div>

              <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <div>
                  <span class="text-xs text-slate-500">Total Compensation:</span>
                  <span class="ml-2 font-mono font-extrabold text-base text-emerald-600 dark:text-emerald-400">₹${totalAmount.toLocaleString('en-IN')}</span>
                </div>
                <button onclick="window.exportPaymentSheetCSV()" class="btn-action flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold hover:bg-slate-200">
                  ${ICONS.download}
                  <span>Export CSV</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderTaskDetailModal(taskId) {
        const task = tasks.find(t => String(t.id) === String(taskId));
        if (!task) return '';
        const taskComments = comments.filter(c => String(c.task_id) === String(taskId));

        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
              <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">${task.work_type || 'OTHER'}</span>
                <button onclick="window.closeTaskDetail()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                  ${ICONS.close}
                </button>
              </div>

              <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 mt-3 mb-1">${task.title}</h3>
              <p class="text-xs text-slate-500 mb-4">${task.descr || 'No additional description provided.'}</p>

              <div class="flex-1 overflow-y-auto my-2 space-y-2">
                <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300">Activity Notes & Comments</h4>
                ${taskComments.length === 0 ? `
                  <p class="text-xs text-slate-400 italic">No notes posted yet.</p>
                ` : taskComments.map(c => `
                  <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-xs">
                    <div class="flex items-center justify-between font-bold text-slate-700 dark:text-slate-300 mb-1">
                      <span>${c.author || 'Team Member'}</span>
                      <span class="text-[10px] text-slate-400">${new Date(c.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div class="text-slate-600 dark:text-slate-300">${c.body}</div>
                  </div>
                `).join('')}
              </div>

              <form onsubmit="window.handleAddComment(event, '${task.id}')" class="mt-3 flex gap-2">
                <input id="comment-input" type="text" placeholder="Add a quick note / comment..." required
                  class="flex-1 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none" />
                <button type="submit" class="btn-action px-3 py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg">
                  Post
                </button>
              </form>
            </div>
          </div>
        `;
      }

      window.setTab = function(tab) { currentFilter = tab; selectedMemberId = null; renderApp(); };
      window.setWorkTypeFilter = function(wt) { currentWorkTypeFilter = wt; renderApp(); };
      window.setThemeMode = setThemeMode;
      window.openPaymentSheet = function() { showPaymentModal = true; renderApp(); };
      window.closePaymentSheet = function() { showPaymentModal = false; renderApp(); };
      window.openTaskDetail = function(taskId) { inspectingTaskId = taskId; renderApp(); };
      window.closeTaskDetail = function() { inspectingTaskId = null; renderApp(); };
      window.clearSelected = function() { selectedTaskIds.clear(); renderApp(); };

      window.toggleSelectTask = function(id, checked) {
        if (checked) selectedTaskIds.add(String(id));
        else selectedTaskIds.delete(String(id));
        renderApp();
      };

      window.toggleSelectAll = function(checked) {
        if (checked) {
          tasks.forEach(t => selectedTaskIds.add(String(t.id)));
        } else {
          selectedTaskIds.clear();
        }
        renderApp();
      };

      window.switchUser = function(userId) {
        const p = profiles.find(x => String(x.id) === String(userId));
        if (p) {
          currentUser = p;
          if (currentUser.name && currentUser.name.toLowerCase().includes('manish')) {
            currentUser.role = 'admin';
          }
          localStorage.setItem('taskqueue_user_id', p.id);
          renderApp();
        }
      };

      window.startTask = startTask;
      window.pauseTask = pauseTask;
      window.completeTask = completeTask;
      window.deleteTask = deleteTask;
      window.bulkAssign = bulkAssign;
      window.bulkChangeStatus = bulkChangeStatus;
      window.bulkDelete = bulkDelete;
      window.exportPaymentSheetCSV = exportPaymentSheetCSV;

      window.handleFastDispatch = function(e) {
        e.preventDefault();
        const title = document.getElementById('dispatch-title').value;
        const assignee = document.getElementById('dispatch-assignee').value;
        const worktype = document.getElementById('dispatch-worktype').value;
        const budget = document.getElementById('dispatch-budget').value;
        const priority = document.getElementById('dispatch-priority').value;
        createTask(title, assignee, priority, worktype, budget);
        document.getElementById('fast-dispatch-form').reset();
      };

      window.handleNewPayment = function(e) {
        e.preventDefault();
        const name = document.getElementById('pay-task-name').value;
        const amt = document.getElementById('pay-amount').value;
        recordPayment(name, amt);
        document.getElementById('pay-task-name').value = '';
        document.getElementById('pay-amount').value = '';
      };

      window.handleAddComment = function(e, taskId) {
        e.preventDefault();
        const input = document.getElementById('comment-input');
        const body = input.value;
        if (!body) return;
        const newComment = {
          id: `com_${Date.now()}`,
          task_id: String(taskId),
          author: currentUser.name || 'Member',
          body,
          created_at: new Date().toISOString()
        };
        comments.push(newComment);
        if (sb) sb.from('comments').insert(newComment);
        input.value = '';
        renderApp();
      };

      // Immediate 0ms Render
      renderApp();
      backgroundSyncData();
    })();
  </script>
</body>
    </html>
