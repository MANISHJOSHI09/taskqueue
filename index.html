async function delAll(){if(!confirm(DL.length+' completed tasks. '+WARN))return;for(const t of DL)await sb.rpc('delete_task',{p_id:t.id});await load()}
function monP(){const m=rp.m||dstr(now()).slice(0,7),[Y,M]=m.split('-').map(Number),n=new Date(Date.UTC(Y,M,0)).getUTCDate(),us=isA()?mem():[me],DR=[];
const S=us.map(u=>{let w=0,e=0,dw=0,ab=0;for(let i=1;i<=n;i++){const d=m+'-'+p2(i),x=dayInfo(u.id,d);if(x){w+=x.W;e+=x.E;dw++;DR.push([d,u.name,tm(x.first),tm(x.last),Math.round(x.W/6e4),Math.round(x.E/6e4),x.n])}else if(absentOn(u.id,d)){ab++;DR.push([d,u.name,'Absent','','','',''])}}return{u,w,e,dw,ab,done:TK.filter(t=>t.status==='completed'&&t.assignee===u.id&&dstr(Date.parse(t.completed_at)).startsWith(m))}});
const CD=S.flatMap(x=>x.done.map(t=>[x.u.name,t.title,dstr(Date.parse(t.completed_at)),Math.round(wk(t)/6e4)]));MX={m,S,DR,CD};
return`<div class="c"><div class="row"><label class="s">Month <input type="month" value="${m}" onchange="if(this.value){rp.m=this.value;paint(1)}"></label><button onclick="expM()">Download monthly CSV</button></div><div class="s">Includes member totals, day-by-day time report and completed work.</div></div><div class="c sc"><table><thead><tr><th>Member</th><th>Days worked</th><th>Absent days</th><th>Work time</th><th>Empty time</th><th>Tasks done</th></tr></thead><tbody>${S.map(x=>`<tr><td>${esc(x.u.name)}</td><td>${x.dw}</td><td>${x.ab}</td><td class="tm">${fm(x.w)}</td><td class="tm late">${fm(x.e)}</td><td>${x.done.length}</td></tr>`).join('')}</tbody></table></div><div class="c sc"><b>Completed work this month</b><table><thead><tr><th>Member</th><th>Task</th><th>Completed on</th><th>Time taken</th></tr></thead><tbody>${CD.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td class="tm">${fm(r[3]*6e4)}</td></tr>`).join('')||'<tr><td colspan="4" class="s">None</td></tr>'}</tbody></table></div>`}
function expM(){const{m,S,DR,CD}=MX;csv([['MONTHLY REPORT',m],[],['Member','Days worked','Absent days','Work min','Empty min','Tasks completed'],...S.map(x=>[x.u.name,x.dw,x.ab,Math.round(x.w/6e4),Math.round(x.e/6e4),x.done.length]),[],['DAILY TIME REPORT'],['Date','Member','First start','Last end','Work min','Empty min','Tasks'],...DR,[],['COMPLETED TASKS'],['Member','Task','Completed on','Minutes taken'],...CD],'monthly_report_'+m+'.csv')}
// ---------- time report ----------
function repRows(){const r=[],us=isA()?mem():[me];let d=rp.to,n=0;while(d>=rp.from&&n++<62){us.forEach(u=>{const i=dayInfo(u.id,d);if(i)r.push({d,u,i});else if(absentOn(u.id,d))r.push({d,u,ab:1})});d=new Date(Date.parse(d+'T00:00:00Z')-864e5).toISOString().slice(0,10)}return r}
const rmk0=(u,s)=>RM.find(r=>r.user_id===u&&Date.parse(r.gap_start)===s);
function rmk(u,s,e){const r=rmk0(u,s),v=prompt('Remark for this empty time (meeting, lunch, break…)',r?.remark||'');if(v===null)return;rpc('save_remark',{p_user:u,p_start:new Date(s).toISOString(),p_end:new Date(e).toISOString(),p_remark:v})}
function repP(){if(rp.sel)return repDet();RR=repRows();
return`<div class="c"><div class="row"><label class="s">From <input type="date" value="${rp.from}" onchange="rp.from=this.value;paint(1)"></label><label class="s">To <input type="date" value="${rp.to}" onchange="rp.to=this.value;paint(1)"></label><button onclick="exp(0)">CSV summary</button><button onclick="exp(1)">CSV detailed</button></div><div class="s" style="margin-top:6px">Day starts at first task start. Empty time = gaps between work sessions until 5 PM (after 5 PM only while working). Absent = no task started by 12 PM.</div></div><div class="c sc"><table><thead><tr><th>Date</th><th>Member</th><th>First start</th><th>Last end</th><th>Work</th><th>Empty</th><th>Tasks</th></tr></thead><tbody>${RR.map((r,i)=>`<tr style="cursor:pointer" onclick="rp.sel=${i};paint(1)"><td>${r.d}</td><td>${esc(r.u.name)}</td>${r.ab?'<td colspan="5" class="late">Absent (no task by 12 PM)</td>':`<td>${tm(r.i.first)}</td><td>${tm(r.i.last)}</td><td class="tm">${fm(r.i.W)}</td><td class="tm late">${fm(r.i.E)}</td><td>${r.i.n}</td>`}</tr>`).join('')||'<tr><td colspan="7" class="s">No data for these dates</td></tr>'}</tbody></table></div>`}
function repDet(){const r=RR[rp.sel];if(!r){rp.sel=null;return repP()}if(r.ab)return`<div class="c"><button onclick="rp.sel=null;paint(1)">← Back</button><p>${esc(r.u.name)} was absent on ${r.d} (no task started by 12 PM).</p></div>`;
return`<div class="c"><button onclick="rp.sel=null;paint(1)">← Back</button> <b>${esc(r.u.name)}</b> · ${r.d}</div><div class="c sc"><table><thead><tr><th>Work (tasks)</th><th>Empty time</th></tr></thead><tbody>${r.i.it.map(x=>{if(!x.g){const t=TK.find(k=>k.id===x.t);return`<tr class="s-running"><td><b>${esc(t?t.title:'Another task')}</b><div class="s">${tm(x.s)}–${tm(x.e)} · ${fm(x.e-x.s)}</div></td><td></td></tr>`}const m=rmk0(r.u.id,x.s);return`<tr class="emp"><td></td><td>${tm(x.s)}–${tm(x.e)} · <b>${fm(x.e-x.s)}</b><div>${m&&m.remark?esc(m.remark):'<span class="s">No remark</span>'}</div><button onclick="rmk('${r.u.id}',${x.s},${x.e})">Add / edit remark</button></td></tr>`}).join('')}<tr><th>Total work: ${fm(r.i.W)}</th><th>Total empty: ${fm(r.i.E)}</th></tr></tbody></table></div>`}
function csv(rows,name){const t='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
function exp(k){const R=RR.length?RR:repRows(),h=k?[['Date','Member','Type','Task','Start','End','Minutes','Remark']]:[['Date','Member','First start','Last end','Work min','Empty min','Tasks','Absent']],o=[];
R.forEach(r=>{if(!k)o.push(r.ab?[r.d,r.u.name,'','','','','','Yes']:[r.d,r.u.name,tm(r.i.first),tm(r.i.last),Math.round(r.i.W/6e4),Math.round(r.i.E/6e4),r.i.n,'No']);else if(r.ab)o.push([r.d,r.u.name,'Absent','','','','','']);else r.i.it.forEach(x=>{const t=TK.find(z=>z.id===x.t),m=rmk0(r.u.id,x.s);o.push([r.d,r.u.name,x.g?'Empty':'Work',x.g?'':(t?t.title:'Another task'),tm(x.s),tm(x.e),Math.round((x.e-x.s)/6e4),x.g&&m?m.remark:''])})});csv(h.concat(o),(k?'time_detail_':'time_summary_')+rp.from+'_'+rp.to+'.csv')}
// ---------- notes ----------
async function loadNotes(){const[a,b]=await Promise.all([sb.from('personal_notes').select('*').order('updated_at',{ascending:false}),sb.from('shared_notes').select('*').order('updated_at',{ascending:false})]);if(a.error)toast(a.error.message);PN=a.data||[];SN=b.data||[];if(view==='notes')paint(1)}
function notesP(){const L=(a,k)=>a.map(n=>`<div class="rw"><b>${esc(n.title)}</b> <span class="s">${fdt(n.updated_at)}</span><div class="row"><button onclick="nOpen('${k}',${n.id})">Open</button><button class="r" onclick="nDel('${k}',${n.id})">Delete</button></div></div>`).join('')||'<div class="s">Nothing here yet</div>';

async function nNew(k){const r=await sb.from(k==='p'?'personal_notes':'shared_notes').insert(k==='p'?{user_id:me.id,title:'Untitled note'}:{updated_by:me.id}).select().single();if(r.error)return toast(r.error.message);ne=r.data;if(k==='s')grid=ne.cells;view=k==='p'?'pn':'sn';paint(1)}

// ---------- notifications ----------
function warns(){const w=[],d=dstr(now());if(isA())mem().forEach(u=>{if(u.role==='admin')return;const l=unf(u.id);if(absentOn(u.id,d))w.push('🚫 '+u.name+' is absent (no task by 12 PM)');else if(!l.some(x=>x.status==='running'))w.push(l.length?'⚠️ '+u.name+' is not working on any task ('+l.length+' pending)':'📭 '+u.name+' has no tasks assigned')});
else{const l=unf(me.id);if(!l.length)w.push('📭 No tasks assigned to you');else if(!l.some(x=>x.status==='running'))w.push('⚠️ You are not working on any task')}
TK.filter(t=>t.status!=='completed').forEach(t=>{if(t.priority==='urgent')w.push('🚨 Urgent: '+t.title+' ('+nm(t.assignee)+')');if(over(t))w.push('⛔ Overdue: '+t.title+' ('+nm(t.assignee)+')');if(t.status==='followup'&&t.followup_at&&Date.parse(t.followup_at)<=now())w.push('🔁 Follow-up due: '+t.title+' ('+nm(t.assignee)+')')});return w}

const un=NT.filter(n=>Date.parse(n.created_at)>gs()).length,B=['notif','🔔'+(un?' '+un:'')],T=isA()?[['home','Home'],['members','All Members'],['tasks','Tasks'],['done','Completed'],['report','Time Report'],['month','Monthly Report'],['notes','Notes'],B]:[['home','My Work'],['tasks','My Tasks'],['done','Completed'],['report','My Time'],['month','Monthly'],['notes','Notes'],B],on=['pn','sn'].includes(view)?'notes':view;
document.body.className=isA()?'adm':'mem';const P0={month:monP,home:homeP,members:memP,tasks:taskP,done:doneP,report:repP,notes:notesP,pn:pnP,sn:snP,notif:notifP};
