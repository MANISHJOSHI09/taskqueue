      function getISTString() {
        return new Date().toLocaleTimeString('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
      }

      function formatDuration(totalSeconds) {
        if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 0) return '0m';
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = Math.floor(totalSeconds % 60);
        if (hrs > 0) return `${hrs}h ${mins}m`;
        if (mins > 0) return `${mins}m ${secs}s`;
        return `${secs}s`;
      }

      function getTaskDuration(taskId) {
        const logs = workLogs.filter(w => String(w.task_id) === String(taskId));
        let total = 0;
        logs.forEach(l => {
          const start = new Date(l.started_at).getTime();
          const end = l.ended_at ? new Date(l.ended_at).getTime() : Date.now();
          if (!isNaN(start) && !isNaN(end)) {
            total += Math.max(0, Math.floor((end - start) / 1000));
          }
        });
        return total;
      }

      function getUserWorkTimeToday(userId) {
        const todayStr = new Date().toISOString().slice(0, 10);
        const logs = workLogs.filter(w => {
          if (String(w.user_id) !== String(userId)) return false;
          const s = w.started_at ? w.started_at.slice(0, 10) : '';
          return s === todayStr;
        });
        let total = 0;
        logs.forEach(l => {
          const start = new Date(l.started_at).getTime();
          const end = l.ended_at ? new Date(l.ended_at).getTime() : Date.now();
          if (!isNaN(start) && !isNaN(end)) {
            total += Math.max(0, Math.floor((end - start) / 1000));
          }
        });
        return total;
      }

      // Background Sync with Supabase (Graceful fallback)
      async function backgroundSyncData() {
        if (!sb) return;
        try {
          const [pRes, tRes, wRes, cRes, payRes] = await Promise.allSettled([
            sb.from('profiles').select('*').order('name'),
            sb.from('tasks').select('*').order('created_at', { ascending: false }),
            sb.from('work_log').select('*').order('started_at', { ascending: true }),
            sb.from('comments').select('*').order('created_at', { ascending: true }),
            sb.from('payment_sheet').select('*').order('created_at', { ascending: false })

            profiles = pRes.value.data;
          }
          if (tRes.status === 'fulfilled' && tRes.value.data && tRes.value.data.length > 0) {
            tasks = tRes.value.data;
          }
          if (wRes.status === 'fulfilled' && wRes.value.data && wRes.value.data.length > 0) {

          }
          if (cRes.status === 'fulfilled' && cRes.value.data && cRes.value.data.length > 0) {

          }

        const nowIso = new Date().toISOString();

        workLogs.forEach(w => {
          if (String(w.user_id) === String(currentUser.id) && !w.ended_at) {
            w.ended_at = nowIso;

        });

        const target = tasks.find(t => String(t.id) === String(taskId));
        if (target) {
          target.status = 'running';
          target.acked = true;
          workLogs.push({
            id: `wl_${Date.now()}`,
            task_id: target.id,
            user_id: currentUser.id,
            started_at: nowIso,
            ended_at: null
          });
        }
        renderApp();

        if (sb) {
          try {
            await sb.rpc('start_task', { p_task_id: taskId, p_user_id: currentUser.id });
          } catch (e) {
            console.warn("Fallback to client-side state:", e);
          }
        }
      }

      async function pauseTask(taskId, followupAt = null) {
        if (!currentUser) return;
        const nowIso = new Date().toISOString();

        workLogs.forEach(w => {
          if (String(w.task_id) === String(taskId) && !w.ended_at) {
            w.ended_at = nowIso;
          }
        });

        const target = tasks.find(t => String(t.id) === String(taskId));
        if (target) {
          target.status = 'followup';
          if (followupAt !== null) target.followup_at = followupAt;
        }
        renderApp();

        if (sb) {
          try {
            await sb.rpc('pause_task', { p_task_id: taskId, p_user_id: currentUser.id, p_followup_at: followupAt });
          } catch (e) {
            console.warn("RPC fallback:", e);
          }
        }
      }

      async function scheduleFollowup(taskId, followupAt) {
        const target = tasks.find(t => String(t.id) === String(taskId));
        if (target) {
          target.followup_at = followupAt;
          target.status = 'followup';
        }
        renderApp();

        if (sb) {
          try {
            await sb.from('tasks').update({ followup_at: followupAt, status: 'followup' }).eq('id', taskId);
          } catch (e) {}

        const target = tasks.find(t => String(t.id) === String(taskId));

          target.completed_at = nowIso;

        renderApp();

        if (sb) {

      function exportPaymentSheetCSV() {
        if (paymentSheet.length === 0) return;
        let csv = "ID,User ID,Task Name,Amount (INR),Notes,Date\n";
        paymentSheet.forEach(p => {
          csv += `"${p.id}","${p.user_id}","${(p.task_name || '').replace(/"/g, '""')}","${p.amount}","${(p.notes || '').replace(/"/g, '""')}","${p.created_at}"\n`;

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

      function renderTaskRow(task, isAdmin) {
        const isSelected = selectedTaskIds.has(String(task.id));
        const isRunning = task.status === 'running';
        const isCompleted = task.status === 'completed';
        const isUrgent = task.priority === 'urgent';
        const durationSec = getTaskDuration(task.id);
        const assigneeObj = profiles.find(p => String(p.id) === String(task.assignee));
        const assigneeName = assigneeObj ? assigneeObj.name : 'Unassigned';

        const wt = task.work_type || 'OTHER';
        let wtBadgeClass = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
        if (wt === 'UAN TIC') wtBadgeClass = 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/70 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800';
        else if (wt === 'RECEPTION') wtBadgeClass = 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800';

        return `
          <div class="px-4 py-3.5 flex items-center justify-between gap-4 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition ${isRunning ? 'bg-emerald-50/40 dark:bg-emerald-950/20' : ''}">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="window.toggleSelectTask('${task.id}', this.checked)"
                class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-600 shrink-0" />

              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider shrink-0 ${wtBadgeClass}">
                ${wt}
              </span>

              ${task.status === 'followup' ? `
                <span class="text-[10px] font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/60 px-2 py-0.5 rounded-md border border-amber-200 dark:border-amber-900/60 shrink-0 flex items-center gap-1">
                  ${ICONS.clock}
                  <span>Follow-up${task.followup_at ? `: ${new Date(task.followup_at).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true })}` : ' (Time not set)'}</span>
                </span>
              ` : ''}

              ${isUrgent ? `<span class="shrink-0">${ICONS.alert}</span>` : ''}

              <div class="flex-1 min-w-0">
                <button onclick="window.openTaskDetail('${task.id}')" class="text-left font-semibold text-xs sm:text-sm text-slate-900 dark:text-slate-100 hover:text-indigo-600 dark:hover:text-indigo-400 truncate block w-full ${isCompleted ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                  ${task.title}
                </button>
              </div>
            </div>

            <div class="flex items-center gap-4 sm:gap-8 shrink-0">
              ${isAdmin ? `
                <div class="hidden sm:block text-right w-28 truncate">
                  <span class="text-xs text-slate-600 dark:text-slate-400 font-medium">${assigneeName}</span>
                </div>
              ` : ''}

              <div class="w-20 text-right">
                <span id="task-timer-${task.id}" class="text-xs font-mono font-bold ${isRunning ? 'text-emerald-600 dark:text-emerald-400 animate-pulse' : 'text-slate-500 dark:text-slate-400'}">
                  ${formatDuration(durationSec)}
                </span>
              </div>

              <div class="w-28 flex items-center justify-end gap-1.5">
                ${isCompleted ? `
                  <span class="text-[11px] font-bold text-violet-600 dark:text-violet-400 px-2 py-0.5 rounded-md bg-violet-50 dark:bg-violet-950/60">Done</span>
                ` : `
                  ${isRunning ? `
                    <button onclick="window.pauseTask('${task.id}')" title="Pause (Move to Follow-up)" class="btn-action p-1.5 rounded-lg bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 hover:bg-amber-200">
                      ${ICONS.pause}
                    </button>
                  ` : `
                    <button onclick="window.startTask('${task.id}')" title="Start Task" class="btn-action p-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-200">
                      ${ICONS.play}
                    </button>
                  `}
                  <button onclick="window.completeTask('${task.id}')" title="Mark Complete" class="btn-action p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-violet-100 hover:text-violet-700">
                    ${ICONS.check}
                  </button>
                `}
                <button onclick="window.deleteTask('${task.id}')" title="Delete Task" class="btn-action p-1.5 rounded-lg text-slate-400 hover:bg-rose-100 hover:text-rose-600">
                  ${ICONS.trash}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // Members Roster Modal
      function renderMembersRosterModal() {
        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-4xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[88vh]">
              <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">

      function exportReportCSV() {
        const isMonthly = reportMode === 'monthly';
        const period = isMonthly ? reportMonth : reportDate;
        let csv = "Member,Period,Completed Tasks,Work Time (Minutes),Empty Time (Minutes)\n";
        profiles.forEach(m => {
          const memberTasks = tasks.filter(t => {
            if (String(t.assignee) !== String(m.id)) return false;
            if (t.status !== 'completed') return false;
            const d = t.completed_at || t.created_at;
            return isMonthly ? d.startsWith(reportMonth) : d.startsWith(reportDate);
          });
          const logs = workLogs.filter(w => {
            if (String(w.user_id) !== String(m.id)) return false;
            return isMonthly ? (w.started_at || '').startsWith(reportMonth) : (w.started_at || '').startsWith(reportDate);
          });
          const workSec = logs.reduce((acc, log) => {
            const s = new Date(log.started_at).getTime();
            const e = log.ended_at ? new Date(log.ended_at).getTime() : Date.now();
            return acc + Math.max(0, Math.floor((e - s) / 1000));
          }, 0);
          const emptySec = Math.max(0, 8 * 3600 - workSec);
          csv += `"${m.name}","${period}",${memberTasks.length},${Math.round(workSec / 60)},${Math.round(emptySec / 60)}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `team_report_${period}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

                    Today
                  </button>

                  <button type="button" onclick="window.setPaymentDate('${yesterdayStr}')" class="btn-action px-2.5 py-1 rounded-lg font-bold transition ${!showAllPaymentDates && selectedPaymentDate === yesterdayStr ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'}">
                    Yesterday
                  </button>

                  <div class="flex items-center gap-1 bg-white dark:bg-slate-800 px-2 py-0.5 rounded-lg border border-slate-200 dark:border-slate-700">
                    <span class="text-[10px] text-slate-400">Date:</span>
                    <input type="date" value="${selectedPaymentDate}" onchange="window.setPaymentDate(this.value)"
                      class="bg-transparent text-xs font-mono font-bold text-slate-900 dark:text-white focus:outline-none" />
                  </div>

                  <button type="button" onclick="window.toggleAllPaymentDates()" class="btn-action px-2.5 py-1 rounded-lg font-bold transition ${showAllPaymentDates ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'}">
                    ${showAllPaymentDates ? 'Showing All' : 'Show All Dates'}
                  </button>
                </div>

                <span class="text-[11px] text-slate-500 dark:text-slate-400">
                  ${showAllPaymentDates ? 'All Dates' : selectedPaymentDate} (${filteredPayments.length} records)
                </span>
              </div>

              <!-- Quick Add Entry Form -->
              <form onsubmit="window.handleNewPayment(event)" class="mb-3 flex flex-col sm:flex-row gap-2">
                <input id="pay-task-name" type="text" placeholder="Task Name..." required
                  class="flex-1 px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                <input id="pay-amount" type="number" step="0.01" min="0" placeholder="Amount (INR)..." required
                  class="w-full sm:w-32 px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono" />
                <input id="pay-notes" type="text" placeholder="Notes (optional)..."
                  class="w-full sm:w-40 px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                <button type="submit" class="btn-action px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm">
                  Add Entry
                </button>
              </form>

              <!-- Table Content: Editable & Deletable -->
              <div class="flex-1 overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm my-2">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-100 dark:bg-slate-800/80 text-[10px] uppercase font-bold text-slate-500 dark:text-slate-400 tracking-wider">
                    <tr>
                      <th class="py-2 px-3">Task Name</th>
                      <th class="py-2 px-3 w-28">Amount</th>
                      <th class="py-2 px-3 w-32">Date</th>
                      <th class="py-2 px-3 w-32">Notes</th>
                      <th class="py-2 px-3 w-20 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800 font-medium text-slate-700 dark:text-slate-300">
                    ${filteredPayments.length === 0 ? `
                      <tr>
                        <td colSpan="5" class="py-10 text-center text-slate-400 italic">
                          No payments found for ${showAllPaymentDates ? 'all dates' : selectedPaymentDate}. Add an entry above.
                        </td>
                      </tr>
                    ` : filteredPayments.map(p => `
                      <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <td class="py-2.5 px-3">
                          ${editingPaymentId === p.id ? `
                            <input id="edit-pay-name-${p.id}" type="text" value="${(p.task_name || '').replace(/"/g, '&quot;')}" class="w-full px-2 py-1 bg-white dark:bg-slate-800 border rounded text-xs" />
                          ` : `
                            <span class="font-semibold text-slate-900 dark:text-white">${p.task_name}</span>
                          `}
                        </td>
                        <td class="py-2.5 px-3 font-mono font-bold text-emerald-600 dark:text-emerald-400">
                          ${editingPaymentId === p.id ? `
                            <input id="edit-pay-amt-${p.id}" type="number" step="0.01" value="${p.amount}" class="w-20 px-2 py-1 bg-white dark:bg-slate-800 border rounded text-xs font-mono" />
                          ` : `
                            ₹${Number(p.amount).toLocaleString('en-IN')}
                          `}
                        </td>
                        <td class="py-2.5 px-3 text-slate-400 text-[11px] font-mono">
                          ${p.created_at ? new Date(p.created_at).toLocaleDateString() : ''}
                        </td>
                        <td class="py-2.5 px-3 text-slate-400 text-[11px] truncate max-w-xs">
                          ${editingPaymentId === p.id ? `
                            <input id="edit-pay-notes-${p.id}" type="text" value="${(p.notes || '').replace(/"/g, '&quot;')}" class="w-full px-2 py-1 bg-white dark:bg-slate-800 border rounded text-xs" />
                          ` : (p.notes || '—')}
                        </td>
                        <td class="py-2.5 px-3 text-right">
                          <div class="flex items-center justify-end gap-1">
                            ${editingPaymentId === p.id ? `
                              <button onclick="window.saveEditPayment('${p.id}')" title="Save" class="p-1 text-emerald-600 hover:bg-emerald-50 rounded">
                                ${ICONS.check}
                              </button>
                              <button onclick="window.cancelEditPayment()" title="Cancel" class="p-1 text-slate-400 hover:bg-slate-100 rounded">
                                ${ICONS.close}
                              </button>
                            ` : `
                              <button onclick="window.startEditPayment('${p.id}')" title="Edit entry" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                ${ICONS.edit}
                              </button>
                            `}
                            <button onclick="window.deletePayment('${p.id}')" title="Delete entry" class="p-1 text-slate-400 hover:text-rose-600 rounded">
                              ${ICONS.trash}
                            </button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <!-- Footer with Compensation Sum -->
              <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <div>
                  <span class="text-xs text-slate-500">Filtered Compensation:</span>
                  <span class="ml-2 font-mono font-extrabold text-base text-emerald-600 dark:text-emerald-400">₹${totalAmount.toLocaleString('en-IN')}</span>
                </div>
                <span class="text-xs text-slate-400">${filteredPayments.length} total entries</span>
              </div>
            </div>
          </div>
        `;
      }

      // Task Detail & Follow-up Scheduling Modal
      function renderTaskDetailModal(taskId) {
        const task = tasks.find(t => String(t.id) === String(taskId));
        if (!task) return '';
        const taskComments = comments.filter(c => String(c.task_id) === String(taskId));
        const durationSec = getTaskDuration(task.id);
        const assigneeObj = profiles.find(p => String(p.id) === String(task.assignee));

        const isRunning = task.status === 'running';
        const isFollowup = task.status === 'followup';

        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[88vh]">
              <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">${task.work_type || 'OTHER'}</span>
                  <span class="text-[11px] px-2 py-0.5 rounded-full font-bold ${task.priority === 'urgent' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">${task.priority}</span>
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${isFollowup ? 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300' : 'text-slate-400'}">
                    Status: ${task.status}
                  </span>
                </div>
                <button onclick="window.closeTaskDetail()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                  ${ICONS.close}
                </button>
              </div>

              <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 mt-3 mb-1">${task.title}</h3>
              <p class="text-xs text-slate-500 mb-2">${task.descr || 'No additional description provided.'}</p>

              <div class="py-2 border-y border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-400 mb-2">
                <div>Assignee: <b class="text-slate-800 dark:text-slate-200">${assigneeObj ? assigneeObj.name : 'Unassigned'}</b></div>
                <div>Elapsed Work: <b class="font-mono text-indigo-600 dark:text-indigo-400">${formatDuration(durationSec)}</b></div>
              </div>

              <!-- Follow-up Scheduling Card -->
              <div class="p-3.5 mb-2 rounded-2xl bg-amber-50/80 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/80 space-y-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-xs font-bold text-amber-900 dark:text-amber-200 uppercase tracking-wider">
                      Follow-up Sheet Schedule
                    </span>
                  </div>
                  ${task.followup_at ? `
                    <button onclick="window.clearFollowup('${task.id}')" class="text-[10px] text-amber-700 dark:text-amber-400 hover:text-rose-600 underline">
                      Clear time
                    </button>
                  ` : ''}
                </div>

                <div class="text-[11px] text-amber-800 dark:text-amber-300 font-medium">
                  ${task.followup_at
                    ? `Scheduled resume: <b class="font-mono font-bold">${new Date(task.followup_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' })}</b>`
                    : 'Paused work · Set when admin or member should take this follow-up again:'}
                </div>

                <div class="flex flex-wrap items-center gap-1.5 pt-1">
                  <button onclick="window.quickFollowupPreset('${task.id}', 30)" class="btn-action px-2 py-1 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-800 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 hover:bg-amber-100">
                    +30m
                  </button>
                  <button onclick="window.quickFollowupPreset('${task.id}', 60)" class="btn-action px-2 py-1 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-800 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 hover:bg-amber-100">
                    +1 hr
                  </button>
                  <button onclick="window.quickFollowupPreset('${task.id}', 120)" class="btn-action px-2 py-1 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-800 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 hover:bg-amber-100">
                    +2 hrs
                  </button>
                  <button onclick="window.tomorrowFollowupPreset('${task.id}')" class="btn-action px-2 py-1 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-800 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 hover:bg-amber-100">
                    Tomorrow 10 AM
                  </button>
                </div>

                <form onsubmit="window.handleCustomFollowup(event, '${task.id}')" class="flex items-center gap-2 pt-1">
                  <input id="custom-followup-input-${task.id}" type="datetime-local" class="px-2 py-1 text-xs font-mono rounded-lg bg-white dark:bg-slate-800 border border-amber-300 dark:border-amber-700 text-slate-900 dark:text-white" />
                  <button type="submit" class="btn-action px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg">
                    Save Schedule
                  </button>
                </form>
              </div>

              <!-- Activity Notes -->
              <div class="flex-1 overflow-y-auto my-1 space-y-2">
                <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300">Activity Notes & Comments</h4>
                ${taskComments.length === 0 ? `
                  <p class="text-xs text-slate-400 italic">No notes posted yet.</p>
                ` : taskComments.map(c => `
                  <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-xs">
                    <div class="flex items-center justify-between font-bold text-slate-700 dark:text-slate-300 mb-1">
                      <span>${c.author || 'Team Member'}</span>
                      <span class="text-[10px] text-slate-400">${new Date(c.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div class="text-slate-600 dark:text-slate-300">${c.body}</div>
                  </div>
                `).join('')}
              </div>

              <form onsubmit="window.handleAddComment(event, '${task.id}')" class="my-2 flex gap-2">
                <input id="comment-input" type="text" placeholder="Add a quick note / comment..." required
                  class="flex-1 px-3 py-2 text-xs rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none" />
                <button type="submit" class="btn-action px-3 py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg">
                  Post
                </button>
              </form>

              <!-- Footer Buttons -->
              <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                <button onclick="window.deleteTask('${task.id}'); window.closeTaskDetail();" class="text-xs text-rose-600 hover:underline">
                  Delete
                </button>

                <div class="flex items-center gap-2">
                  ${isRunning ? `
                    <button onclick="window.pauseTask('${task.id}'); window.closeTaskDetail();" class="btn-action px-3 py-1.5 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-200 text-xs font-bold flex items-center gap-1">
                      ${ICONS.pause}
                      <span>Pause (Move to Follow-up)</span>
                    </button>
                    <button onclick="window.completeTask('${task.id}'); window.closeTaskDetail();" class="btn-action px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1 shadow-sm">
                      ${ICONS.check}
                      <span>Mark Done</span>
                    </button>
                  ` : `
                    <button onclick="window.startTask('${task.id}'); window.closeTaskDetail();" class="btn-action px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1 shadow-sm">
                      ${ICONS.play}
                      <span>${isFollowup ? 'Resume / Take Follow-up' : 'Start Work'}</span>
                    </button>
                    ${!isFollowup ? `
                      <button onclick="window.pauseTask('${task.id}'); window.closeTaskDetail();" class="btn-action px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 text-xs font-bold border border-amber-200 dark:border-amber-800">
                        Move to Follow-up
                      </button>
                    ` : ''}
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // Window Global Bindings
      window.selectLoginUser = function(userId) {
        selectedLoginUserId = userId;
        loginError = '';
        renderApp();
      };

      window.handleLoginSubmit = function(e) {
        e.preventDefault();
        const pwdInput = document.getElementById('login-password-input');
        const userSelect = document.getElementById('login-user-select');
        const userId = userSelect ? userSelect.value : selectedLoginUserId;
        const password = pwdInput ? pwdInput.value : '';
        loginUser(userId, password);
      };

      window.logoutUser = logoutUser;
      window.setTab = function(tab) { currentFilter = tab; selectedMemberId = null; renderApp(); };
      window.setWorkTypeFilter = function(wt) { currentWorkTypeFilter = wt; renderApp(); };
      window.setThemeMode = setThemeMode;

      window.openPaymentSheet = function() { showPaymentModal = true; renderApp(); };
      window.closePaymentSheet = function() { showPaymentModal = false; renderApp(); };
      window.openMembersRosterModal = function() { showMembersRosterModal = true; renderApp(); };
      window.closeMembersRosterModal = function() { showMembersRosterModal = false; renderApp(); };
      window.openReportsModal = function() { showReportsModal = true; renderApp(); };
      window.closeReportsModal = function() { showReportsModal = false; renderApp(); };
      window.setReportDate = function(dateStr) { reportDate = dateStr; renderApp(); };
      window.setReportMonth = function(monthStr) { reportMonth = monthStr; renderApp(); };
      window.setReportMode = function(mode) { reportMode = mode; renderApp(); };
      window.toggleReportMember = function(memberId) {
        expandedReportMemberId = expandedReportMemberId === memberId ? null : memberId;
        renderApp();
      };
      window.exportReportCSV = exportReportCSV;
      window.openMemberTasks = function(memberId) { drilldownMemberId = memberId; renderApp(); };
      window.closeMemberTasks = function() { drilldownMemberId = null; renderApp(); };
      window.openTaskDetail = function(taskId) { inspectingTaskId = taskId; renderApp(); };
      window.closeTaskDetail = function() { inspectingTaskId = null; renderApp(); };
      window.clearSelected = function() { selectedTaskIds.clear(); renderApp(); };

      // Payment operations
      window.setPaymentDate = function(dateStr) { selectedPaymentDate = dateStr; showAllPaymentDates = false; renderApp(); };
      window.toggleAllPaymentDates = function() { showAllPaymentDates = !showAllPaymentDates; renderApp(); };
      window.startEditPayment = function(id) { editingPaymentId = id; renderApp(); };
      window.cancelEditPayment = function() { editingPaymentId = null; renderApp(); };
      window.saveEditPayment = function(id) {
        const nameEl = document.getElementById(`edit-pay-name-${id}`);
        const amtEl = document.getElementById(`edit-pay-amt-${id}`);
        const notesEl = document.getElementById(`edit-pay-notes-${id}`);
        const name = nameEl ? nameEl.value.trim() : '';
        const amt = amtEl ? amtEl.value : 0;
        const notes = notesEl ? notesEl.value.trim() : '';
        if (name && amt) updatePayment(id, name, amt, notes);
      };
      window.deletePayment = deletePayment;

      window.toggleSelectTask = function(id, checked) {
        if (checked) selectedTaskIds.add(String(id));
        else selectedTaskIds.delete(String(id));
        renderApp();
      };

      window.toggleSelectAll = function(checked) {
        if (checked) {
          tasks.forEach(t => selectedTaskIds.add(String(t.id)));
        } else {
          selectedTaskIds.clear();
        }
        renderApp();
      };

      window.startTask = startTask;
      window.pauseTask = pauseTask;
      window.scheduleFollowup = scheduleFollowup;
      window.quickFollowupPreset = function(taskId, minutes) {
        const d = new Date(Date.now() + minutes * 60 * 1000);
        scheduleFollowup(taskId, d.toISOString());
      };
      window.tomorrowFollowupPreset = function(taskId) {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        d.setHours(10, 0, 0, 0);
        scheduleFollowup(taskId, d.toISOString());
      };
      window.clearFollowup = function(taskId) {
        scheduleFollowup(taskId, null);
      };
      window.handleCustomFollowup = function(e, taskId) {
        e.preventDefault();
        const input = document.getElementById(`custom-followup-input-${taskId}`);
        if (input && input.value) {
          scheduleFollowup(taskId, new Date(input.value).toISOString());
        }
      };
      window.completeTask = completeTask;
      window.deleteTask = deleteTask;
      window.bulkAssign = bulkAssign;
      window.bulkChangeStatus = bulkChangeStatus;
      window.bulkDelete = bulkDelete;
      window.exportPaymentSheetCSV = exportPaymentSheetCSV;

      window.handleFastDispatch = function(e) {
        e.preventDefault();
        const title = document.getElementById('dispatch-title').value;
        const assignee = document.getElementById('dispatch-assignee').value;
        const worktype = document.getElementById('dispatch-worktype').value;
        const budget = document.getElementById('dispatch-budget').value;
        const priority = document.getElementById('dispatch-priority').value;
        createTask(title, assignee, priority, worktype, budget);
        document.getElementById('fast-dispatch-form').reset();
      };

      window.handleNewPayment = function(e) {
        e.preventDefault();
        const name = document.getElementById('pay-task-name').value;
        const amt = document.getElementById('pay-amount').value;
        const notes = document.getElementById('pay-notes') ? document.getElementById('pay-notes').value : '';
        recordPayment(name, amt, notes);
        document.getElementById('pay-task-name').value = '';
        document.getElementById('pay-amount').value = '';
        if (document.getElementById('pay-notes')) document.getElementById('pay-notes').value = '';
      };

      window.handleAddComment = function(e, taskId) {
        e.preventDefault();
        const input = document.getElementById('comment-input');
        const body = input.value;
        if (!body) return;
        const newComment = {
          id: `com_${Date.now()}`,
          task_id: String(taskId),
          author: currentUser.name || 'Member',
          body,
          created_at: new Date().toISOString()
        };
        comments.push(newComment);
        if (sb) sb.from('comments').insert(newComment);
        input.value = '';
        renderApp();
      };

      // 0ms Instant Render & Background Sync
      renderApp();
      backgroundSyncData();
    })();
  </script>
</body>
</html>
